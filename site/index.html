<style>
/* Layout: glass sidebar of co-curricular sections + glass workspace; each section owns a hue, the page ground is a soft multi-hue gradient */
:root{
  --bg:#eef0fa; --blob-a:#9ee7dc; --blob-b:#ffc7b0; --blob-c:#d6c8ff; --blob-d:#ffe39a;
  --glass:rgba(255,255,255,.58); --glass-strong:rgba(255,255,255,.86); --glass-soft:rgba(255,255,255,.38);
  --stroke:rgba(255,255,255,.85); --line:rgba(44,46,98,.11); --shadow:0 10px 30px rgba(60,58,140,.10);
  --fg:#1c1e3c; --muted:#5b5f86; --faint:#8a8eb2;
  --accent:#5a48e8; --accent-ink:#ffffff;
  --c-utama:#5a48e8; --c-murid:#1689a8; --c-uni:#0d9c8f; --c-kelab:#8a52ee; --c-sukan:#f0643f; --c-rumah:#df3f86; --c-ol:#e0731a;
  --c-akt:#2a84e6; --c-capai:#d89410; --c-jk:#4f5bd5; --c-mes:#c2499a; --c-doc:#4f6b8a; --c-pajsk:#1f9b55;
  --danger:#d13a3a; --warn:#c77a06; --ok:#178a4c;
  --f-display:"Bricolage Grotesque", "Trebuchet MS", system-ui, sans-serif;
  --f-body:"Figtree", "Segoe UI", system-ui, sans-serif;
  --r-lg:22px; --r-md:14px; --r-sm:10px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0d0f26; --blob-a:#0f5b57; --blob-b:#6a2b3a; --blob-c:#3b2a7a; --blob-d:#5a4410;
  --glass:rgba(32,36,78,.55); --glass-strong:rgba(38,42,90,.9); --glass-soft:rgba(32,36,78,.32);
  --stroke:rgba(255,255,255,.10); --line:rgba(220,224,255,.10); --shadow:0 10px 30px rgba(0,0,0,.35);
  --fg:#eceeff; --muted:#a8acd8; --faint:#7a7fae;
  --accent:#8f80ff; --accent-ink:#11122b;
  --c-utama:#9a8dff; --c-murid:#4cc6dc; --c-uni:#34d1c0; --c-kelab:#b48cff; --c-sukan:#ff8a66; --c-rumah:#ff6faa; --c-ol:#ffa45c;
  --c-akt:#62adff; --c-capai:#f5bd3e; --c-jk:#8792ff; --c-mes:#ee7cc6; --c-doc:#9fb4cc; --c-pajsk:#4fd08a;
  --danger:#ff7676; --warn:#f5b04a; --ok:#55d68e; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0d0f26; --blob-a:#0f5b57; --blob-b:#6a2b3a; --blob-c:#3b2a7a; --blob-d:#5a4410;
  --glass:rgba(32,36,78,.55); --glass-strong:rgba(38,42,90,.9); --glass-soft:rgba(32,36,78,.32);
  --stroke:rgba(255,255,255,.10); --line:rgba(220,224,255,.10); --shadow:0 10px 30px rgba(0,0,0,.35);
  --fg:#eceeff; --muted:#a8acd8; --faint:#7a7fae;
  --accent:#8f80ff; --accent-ink:#11122b;
  --c-utama:#9a8dff; --c-murid:#4cc6dc; --c-uni:#34d1c0; --c-kelab:#b48cff; --c-sukan:#ff8a66; --c-rumah:#ff6faa; --c-ol:#ffa45c;
  --c-akt:#62adff; --c-capai:#f5bd3e; --c-jk:#8792ff; --c-mes:#ee7cc6; --c-doc:#9fb4cc; --c-pajsk:#4fd08a;
  --danger:#ff7676; --warn:#f5b04a; --ok:#55d68e; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{
  margin:0; color:var(--fg); font-family:var(--f-body); font-size:15px; line-height:1.5;
  background:
    radial-gradient(40vmax 40vmax at 8% 6%, var(--blob-a), transparent 60%),
    radial-gradient(38vmax 38vmax at 96% 10%, var(--blob-c), transparent 60%),
    radial-gradient(42vmax 42vmax at 90% 96%, var(--blob-b), transparent 60%),
    radial-gradient(34vmax 34vmax at 6% 92%, var(--blob-d), transparent 60%),
    var(--bg);
  background-attachment:fixed;
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--glass-strong)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px}
.glass{background:var(--glass);border:1px solid var(--stroke);backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4);box-shadow:var(--shadow)}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;border-radius:0;border-left:0;border-right:0;border-top:0;background:var(--glass-strong)}
.top-in{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1400px;margin:0 auto}
.brand{display:flex;align-items:center;gap:10px;min-width:0;margin-right:auto}
.logo{width:38px;height:38px;border-radius:12px;flex:none;background:conic-gradient(from 200deg,var(--c-uni),var(--c-akt),var(--c-kelab),var(--c-rumah),var(--c-sukan),var(--c-capai),var(--c-uni));display:grid;place-items:center}
.logo span{width:16px;height:16px;border-radius:50%;background:var(--glass-strong)}
.logo.haslencana{background:#fff;width:46px;height:46px;border-radius:12px;padding:3px;box-shadow:0 1px 4px rgba(0,0,0,.12)}
.logo.haslencana img{width:100%;height:100%;object-fit:contain}
.brand h1{font-family:var(--f-display);font-weight:800;font-size:1.15rem;margin:0;line-height:1.1;letter-spacing:-.01em}
.brand small{display:block;color:var(--muted);font-size:.78rem;font-weight:500}
.years{display:flex;gap:6px;align-items:center;overflow-x:auto;max-width:100%;scrollbar-width:none}
.years::-webkit-scrollbar{display:none}
.ylabel{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-right:2px}
.chip{border:1px solid var(--line);background:var(--glass-soft);border-radius:999px;padding:6px 13px;font-weight:600;font-size:.86rem;cursor:pointer;white-space:nowrap;font-variant-numeric:tabular-nums}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn{border:0;border-radius:12px;padding:9px 16px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:7px;white-space:nowrap;text-decoration:none;color:inherit}
.btn-main{background:linear-gradient(135deg,var(--hue,var(--accent)),color-mix(in srgb,var(--hue,var(--accent)) 70%,#ff9a5a));color:#fff;box-shadow:0 6px 16px color-mix(in srgb,var(--hue,var(--accent)) 35%,transparent)}
.btn-ghost{background:var(--glass-soft);border:1px solid var(--line)}
.btn-danger{background:transparent;color:var(--danger);border:1px solid color-mix(in srgb,var(--danger) 40%,transparent)}
.btn-sm{padding:6px 11px;font-size:.84rem;border-radius:10px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn svg{width:16px;height:16px}

.shell{display:grid;grid-template-columns:250px minmax(0,1fr);gap:20px;max-width:1400px;margin:0 auto;padding-block:20px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
nav.side{border-radius:var(--r-lg);padding:12px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 84px);align-self:start;display:flex;flex-direction:column;gap:2px;max-height:calc(100vh - 100px);overflow-y:auto}
.navgroup{font-size:.7rem;letter-spacing:.09em;text-transform:uppercase;color:var(--faint);font-weight:700;padding:12px 10px 4px}
.navlink{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:12px;text-decoration:none;color:var(--fg);font-weight:600;font-size:.93rem;border:1px solid transparent}
.navlink:hover{background:var(--glass-soft)}
.navlink .ic{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:color-mix(in srgb,var(--hue) 16%,transparent);color:var(--hue);flex:none}
.navlink .ic svg{width:17px;height:17px}
.navlink .n{margin-left:auto;font-size:.76rem;color:var(--muted);font-variant-numeric:tabular-nums}
.navlink[aria-current="page"]{background:var(--glass-strong);border-color:var(--stroke);box-shadow:0 4px 14px color-mix(in srgb,var(--hue) 22%,transparent)}
.navlink[aria-current="page"] .ic{background:var(--hue);color:#fff}

main{min-width:0;display:flex;flex-direction:column;gap:18px}
.hero{border-radius:var(--r-lg);padding:22px 24px;display:flex;gap:18px;align-items:flex-start;flex-wrap:wrap;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-60px;top:-80px;width:240px;height:240px;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--hue) 40%,transparent),transparent 70%);pointer-events:none}
.hero .big-ic{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;color:#fff;background:linear-gradient(140deg,var(--hue),color-mix(in srgb,var(--hue) 60%,#ffb36b));flex:none}
.hero .big-ic svg{width:26px;height:26px}
.hero-text{flex:1 1 300px;min-width:0;position:relative;z-index:1}
.eyebrow{font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--hue)}
.hero h2{font-family:var(--f-display);font-weight:800;font-size:clamp(1.45rem,2.6vw,2rem);margin:2px 0 6px;letter-spacing:-.015em;text-wrap:balance;line-height:1.15}
.hero p{margin:0;color:var(--muted);max-width:68ch}
.hero-actions{display:flex;gap:8px;flex-wrap:wrap;position:relative;z-index:1}
.back{display:inline-flex;align-items:center;gap:4px;color:var(--muted);font-weight:600;text-decoration:none;font-size:.86rem;margin-bottom:4px}
.back:hover{color:var(--hue)}

.panel{border-radius:var(--r-lg);padding:18px}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.search{flex:1 1 220px;min-width:0;display:flex;align-items:center;gap:8px;background:var(--glass-soft);border:1px solid var(--line);border-radius:12px;padding:0 12px}
.search input{border:0;background:transparent;padding:9px 0;width:100%;outline:none}
.search svg{width:16px;height:16px;color:var(--muted);flex:none}
.count{color:var(--muted);font-size:.86rem;font-variant-numeric:tabular-nums}
.toggle{display:inline-flex;align-items:center;gap:7px;font-size:.86rem;font-weight:600;color:var(--muted);cursor:pointer}
.toggle input{accent-color:var(--hue,var(--accent));width:16px;height:16px}

.tablewrap{overflow-x:auto;border-radius:var(--r-md)}
table{width:100%;border-collapse:collapse;font-size:.92rem}
th{text-align:left;font-size:.72rem;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
th button{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:4px}
th button:focus-visible{outline:2px solid var(--accent);border-radius:4px}
th .ar{opacity:.35;font-size:.8em}
th[aria-sort] .ar{opacity:1;color:var(--hue)}
td{padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:top}
td.num{font-variant-numeric:tabular-nums}
tbody tr.click{cursor:pointer;transition:background .15s}
tbody tr.click:hover{background:var(--glass-soft)}
tr.dim td{opacity:.55}
tr.gap td:first-child{box-shadow:inset 3px 0 0 var(--warn)}
.yr{display:inline-block;font-variant-numeric:tabular-nums;font-weight:700;font-size:.8rem;padding:2px 8px;border-radius:999px;background:color-mix(in srgb,var(--hue) 15%,transparent);color:var(--hue)}
.pill{display:inline-block;font-size:.76rem;font-weight:700;padding:2px 9px;border-radius:999px;white-space:nowrap}
.pill-warn{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.pill-ok{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok)}
.pill-mute{background:color-mix(in srgb,var(--faint) 20%,transparent);color:var(--muted)}
.pill-hue{background:color-mix(in srgb,var(--hue) 16%,transparent);color:var(--hue)}
.lvl-Sekolah{background:color-mix(in srgb,var(--faint) 20%,transparent);color:var(--muted)}
.lvl-Zon{background:color-mix(in srgb,var(--c-uni) 18%,transparent);color:var(--c-uni)}
.lvl-Daerah{background:color-mix(in srgb,var(--c-akt) 18%,transparent);color:var(--c-akt)}
.lvl-Negeri{background:color-mix(in srgb,var(--c-kelab) 18%,transparent);color:var(--c-kelab)}
.lvl-Kebangsaan,.lvl-Antarabangsa{background:color-mix(in srgb,var(--c-capai) 22%,transparent);color:var(--c-capai)}
.title-cell{font-weight:700}
.sub{color:var(--muted);font-size:.83rem}
a.lnk{color:var(--hue);font-weight:600;word-break:break-all}
.jsel{border:1px solid var(--line);background:var(--glass-soft);border-radius:999px;padding:4px 10px;font-size:.84rem;font-weight:600;color:var(--muted);cursor:pointer;max-width:100%}
.jsel.on{background:color-mix(in srgb,var(--hue) 16%,transparent);color:var(--hue);border-color:color-mix(in srgb,var(--hue) 35%,transparent)}
.clsnav{display:flex;gap:10px;flex-wrap:wrap;align-items:center;padding:12px 14px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 70px);z-index:5;background:var(--glass-strong)}
.clsnav .search{flex:1 1 200px}
.clsjump{display:flex;gap:6px;align-items:center}
.clsjump select{border:1px solid var(--line);background:var(--glass);border-radius:10px;padding:6px 10px;font-weight:700;min-width:130px}
.clsjump .btn{padding:6px 12px;font-size:1.1rem;line-height:1}
@media (max-width:900px){.clsnav{top:calc(env(safe-area-inset-top,0px) + 112px)}}
.banner{border-radius:var(--r-lg);overflow:hidden;border:1px solid var(--stroke);box-shadow:var(--shadow);aspect-ratio:16/3;max-width:100%;background:var(--glass)}
.banner img{width:100%;height:100%;object-fit:cover;display:block}
.suratgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.surat{margin:0;border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden;background:var(--glass-soft);display:flex;flex-direction:column}
.surat img{width:100%;max-height:420px;object-fit:contain;background:#fff;display:block}
.suratpdf{display:grid;place-items:center;gap:8px;padding:40px 12px;color:var(--hue);text-decoration:none;min-height:200px}
.suratpdf svg{width:48px;height:48px}
.surat figcaption{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:10px 12px;font-size:.86rem;font-weight:600;border-top:1px solid var(--line)}
.months{display:grid;gap:18px}
.month h4{margin:0 0 8px;font-family:var(--f-display);font-size:1.05rem;display:flex;gap:8px;align-items:baseline}
.month h4 span{font-family:var(--f-body);font-weight:500;font-size:.8rem;color:var(--muted)}
.panel h3 .btn{margin-left:auto}
.rolebadge{background:color-mix(in srgb,var(--accent) 14%,transparent);color:var(--accent);font-size:.74rem}
.gres{max-height:240px;overflow-y:auto}
.limgs{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.limgs img{width:100%;max-height:320px;object-fit:cover;border-radius:12px;border:1px solid var(--line);display:block;background:var(--glass-soft)}
.ldoc{display:flex;gap:10px;align-items:center;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--glass-soft);color:inherit;text-decoration:none;font-weight:600;font-size:.88rem;word-break:break-word}
.ldoc svg{width:28px;height:28px;color:var(--hue);flex:none}
.rdot{display:inline-flex;align-items:center;gap:5px;font-weight:700;font-size:.82rem;white-space:nowrap}
.rdot::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--rh);flex:none;box-shadow:0 0 0 2px color-mix(in srgb,var(--rh) 25%,transparent)}
.olprog{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;margin-bottom:14px}
.olprog .track{height:10px;border-radius:999px;background:var(--glass-soft);border:1px solid var(--line);overflow:hidden}
.olprog .fill{height:100%;background:linear-gradient(90deg,var(--hue),color-mix(in srgb,var(--hue) 50%,#ffd36b))}
.olchamp{display:flex;flex-wrap:wrap;gap:4px 14px;align-items:baseline;padding:14px 18px;border-radius:var(--r-md);margin-bottom:14px;background:linear-gradient(120deg,color-mix(in srgb,var(--rh) 22%,transparent),transparent);border:1px solid color-mix(in srgb,var(--rh) 40%,transparent)}
.olchamp .eyebrow{color:var(--rh);width:100%}
.olchamp b{font-family:var(--f-display);font-size:1.6rem}
.olstand{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.olcard{position:relative;border-radius:var(--r-md);padding:16px;background:var(--glass-soft);border:1px solid var(--line);border-top:4px solid var(--rh);display:grid;gap:6px}
.olrank{position:absolute;top:12px;right:14px;font-family:var(--f-display);font-weight:800;font-size:1.3rem;color:var(--faint)}
.olname{font-family:var(--f-display);font-weight:800;font-size:1.1rem}
.olpts{font-family:var(--f-display);font-weight:800;font-size:2.2rem;line-height:1;color:var(--rh);font-variant-numeric:tabular-nums}
.olpts small{font-family:var(--f-body);font-size:.8rem;font-weight:600;color:var(--muted);margin-left:4px}
.olbar{height:8px;border-radius:999px;background:var(--glass);overflow:hidden}
.olbar div{height:100%;background:var(--rh);border-radius:999px}
.medals{display:flex;gap:6px}
.md{min-width:30px;height:24px;border-radius:999px;display:inline-grid;place-items:center;font-weight:800;font-size:.8rem;color:#2b2200;padding:0 8px;font-variant-numeric:tabular-nums}
.md.g{background:#f5c542}.md.s{background:#cfd6df}.md.b{background:#d99a62}
.oltab td.top{font-weight:800;color:var(--hue)}
.oltab tr.sum td{font-weight:700;background:var(--glass-soft)}
.oltab tr.grand td{font-weight:800}
.olres{display:grid;gap:3px}
.olres > span{display:flex;gap:10px;align-items:center;flex-wrap:nowrap;white-space:nowrap}
.olkel{display:inline-flex;gap:4px;align-items:center}
.olrow{display:grid;grid-template-columns:34px minmax(120px,150px) minmax(0,1fr) 96px 62px;gap:8px;align-items:center;padding:8px;border-radius:12px;background:var(--glass-soft);border:1px solid var(--line);margin-bottom:6px}
.olrow .olasal{min-width:0}
.olrow select,.olrow input{width:100%;border:1px solid var(--line);background:var(--glass);border-radius:9px;padding:7px 9px;min-width:0}
.olp{display:grid;gap:6px;min-width:0}
.olplace{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:800;background:var(--glass);border:1px solid var(--line)}
.olplace.p1{background:#f5c542;color:#2b2200;border-color:transparent}.olplace.p2{background:#cfd6df;color:#1f2933;border-color:transparent}.olplace.p3{background:#d99a62;color:#2b1400;border-color:transparent}
.olpt{font-size:.8rem;font-weight:700;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
@media (max-width:640px){.olrow{grid-template-columns:34px minmax(0,1fr) 70px}.olrow .olp{grid-column:1/-1}.olrow .olc{grid-column:1/3}.olrow .olpt{grid-column:3}}
.olbest .olpts{font-size:1.8rem}
.implist{display:grid;gap:10px}
.impcard{border:1px solid var(--line);border-radius:var(--r-md);padding:12px;background:var(--glass-soft);display:grid;gap:8px}
.impcard.off{opacity:.6}

const DATA_SECS = SECTIONS.filter(s=>s.fields);

const esc = s => String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const BULAN = ['Jan','Feb','Mac','Apr','Mei','Jun','Jul','Ogo','Sep','Okt','Nov','Dis'];
const HARI = ['Ahad','Isnin','Selasa','Rabu','Khamis','Jumaat','Sabtu'];
const fmtDate = d => { if(!d) return ''; const [y,m,dd]=d.split('-'); return `${+dd} ${BULAN[+m-1]||''} ${y}`; };
const hariOf = d => { if(!d) return ''; const t=new Date(d+'T00:00:00'); return isNaN(t)?'':HARI[t.getDay()]; };
const THIS_YEAR = new Date().getFullYear();
const todayStr = () => { const t=new Date(); return `${t.getFullYear()}-${String(t.getMonth()+1).padStart(2,'0')}-${String(t.getDate()).padStart(2,'0')}`; };
const uid = () => Math.random().toString(36).slice(2,8)+Date.now().toString(36).slice(-4);
const tc = s => String(s||'').toLowerCase().replace(/(^|[\s\-\/(])([a-zà-ÿ])/g,(m,a,b)=>a+b.toUpperCase());
const normNama = s => String(s||'').trim().replace(/\s+/g,' ');
function normKelas(s){
  s = String(s||'').trim().replace(/\s+/g,' ');
  if(!s) return '';
  const m = s.match(/^(?:tahun|thn|t)?\s*(\d)\s*[-.:]?\s*(.*)$/i);
  if(m){ let rest = m[2]; const code = rest.trim().toUpperCase(); if(KELAS_KOD[code]) rest = KELAS_KOD[code]; return m[1] + (rest ? ' '+tc(rest) : ''); }
  const k = s.match(/^(pra\s*ppki|prasekolah\s+pendidikan\s+khas|ppki|pendidikan\s+khas|prasekolah|pra\s*sekolah)\s*(.*)$/i);
  if(k){ const h=k[1].toLowerCase().replace(/\s+/g,' '); const pre = /^pra ?ppki|^prasekolah pendidikan khas/.test(h)?'Pra PPKI':/^(ppki|pendidikan khas)/.test(h)?'PPKI':'Prasekolah'; return pre + (k[2]?' '+tc(k[2]):''); }
  return tc(s);
}
const KELAS_KOD = {Z:'Zamrud', D:'Delima'};
/* Urutan kelas: ikut tahun, kemudian Zamrud, Delima, kemudian kelas lain ikut abjad */
const KELAS_URUT = ['zamrud','delima','mutiara','berlian'];
function cmpKelas(a,b){
  a=String(a||''); b=String(b||'');
  const rk=x=>{ const g=kelasGroup(x); return g==='prappki'?-2:g==='pra'?-1:g==='ppki'?8:(darjahOf(x)||9); };
  const da=rk(a), db=rk(b); if(da!==db) return da-db;
  const strip=x=>x.replace(/^\d\s*/,'').replace(/^(pra ppki|prasekolah|ppki)\s*/i,'').toLowerCase();
  const na=strip(a), nb=strip(b);
  const ia=KELAS_URUT.indexOf(na), ib=KELAS_URUT.indexOf(nb);
  if(ia!==ib) return (ia<0?99:ia)-(ib<0?99:ib);
  return a.localeCompare(b,'ms');
}
const cmpMurid = (a,b) => cmpKelas(a.kelas,b.kelas) || String(a.nama).localeCompare(String(b.nama),'ms');
/* Tahun 1-3: sukan & rumah sukan sahaja. Tahun 4-6: keempat-empat. */
const wajib = d => (d>=1 && d<=3) ? ['sukan','rumah'] : ['beruniform','kelab','sukan','rumah'];
const kelasGroup = k => { const s=String(k||'').toLowerCase(); return /^pra ppki/.test(s)?'prappki':/^prasekolah/.test(s)?'pra':/^ppki/.test(s)?'ppki':''; };
const darjahOf = k => { const m=String(k||'').match(/^(\d)/); return m?+m[1]:0; };
const pkey = m => normNama(m.nama).toUpperCase()+'|'+normKelas(m.kelas).toUpperCase();

const state = { sec:'utama', unitId:null, tab:'ahli', year:THIS_YEAR, q:'', mq:'', sort:null, showPindah:false, kelas:null, gapOnly:false,
  records:[], members:{}, reports:[], loaded:false, mloaded:false, rloaded:false, db:null, canWrite:null, dl:null, offline:false, unsubR:null };

const $ = id => document.getElementById(id);
function toast(msg){ const t=$('toast'); t.textContent=msg; t.hidden=false; clearTimeout(toast.t); toast.t=setTimeout(()=>t.hidden=true,2600); }
const editable = () => state.canWrite!==false && !!state.db && (typeof canArea!=='function' || (canArea(curArea()) && ownUnitOk()));

function years(){
  const set = new Set([THIS_YEAR]);
  state.records.forEach(r=>{ if(r.tahun) set.add(+r.tahun); });
  return [...set].sort((a,b)=>b-a);
}
function inYear(r){ return state.year==='all' || +r.tahun===+state.year; }
function recs(sec){ return state.records.filter(r=>r.sec===sec && inYear(r)); }
function yearLabel(){ return state.year==='all' ? 'semua tahun' : 'tahun '+state.year; }
const memberList = id => (state.members[id] && state.members[id].list) || [];
const activeMembers = id => memberList(id).filter(m=>m.status!=='pindah' && m.status!=='berhenti');
const reportsOf = id => state.reports.filter(r=>r.unitId===id).sort((a,b)=>(+b.bil||0)-(+a.bil||0) || String(b.tarikh).localeCompare(String(a.tarikh)));
function ahliCount(r){ const l=memberList(r.id); return l.length ? activeMembers(r.id).length : (+r.ahli||0); }

/* ---------- top & nav ---------- */
function renderYears(){
  const ys = years();
  $('years').innerHTML = `<span class="ylabel">Tahun</span>` +
    ys.map(y=>`<button class="chip" data-y="${y}" aria-pressed="${state.year===y}">${y}</button>`).join('') +
    `<button class="chip" data-y="all" aria-pressed="${state.year==='all'}">Semua</button>`;
}
$('years').addEventListener('click',e=>{
  const b=e.target.closest('[data-y]'); if(!b) return;
  state.year = b.dataset.y==='all'?'all':+b.dataset.y;
  try{ localStorage.setItem('kk-year', String(state.year)); }catch(_){}
  state.kelas=null; subscribeReports(); subscribeOlahraga(); subscribePajsk(); render();
});
function navCount(s){
  if(s.id==='murid') return compilePupils().pupils.length || '';
  if(s.id==='olahraga') return (state.olAcara||[]).length || '';
  return s.fields ? recs(s.id).length : '';
}
function renderNav(){
  let html='', last='';
  const ur = state.sec==='unit' ? state.records.find(x=>x.id===state.unitId) : null;
  const curSec = state.sec==='unit' ? (ur?ur.sec:'') : state.sec;
  const prev = state.sec; state.sec = curSec;
  SECTIONS.filter(s=>!s.admin||state.isAdmin).forEach(s=>{
    if(s.group!==last){ html+=`<div class="navgroup">${esc(s.group)}</div>`; last=s.group; }
    html+=`<a class="navlink" href="#${s.id}" style="--hue:var(${s.hue})" ${state.sec===s.id?'aria-current="page"':''}><span class="ic">${svg(s.id)}</span>${esc(s.name)}<span class="n">${navCount(s)}</span></a>`;
  });
  $('side').innerHTML = html;
  $('mnav').innerHTML = SECTIONS.filter(s=>!s.admin||state.isAdmin).map(s=>`<a href="#${s.id}" style="--hue:var(${s.hue})" ${state.sec===s.id?'aria-current="page"':''}><span class="ic">${svg(s.id)}</span>${esc(s.name)}</a>`).join('');
  state.sec = prev;
  const cur = $('mnav').querySelector('[aria-current]'); if(cur && render.scrollNav){ cur.scrollIntoView({inline:'center',block:'nearest'}); render.scrollNav=false; }
}

  const L={aktiviti:'Tambah aktiviti',pencapaian:'Tambah pencapaian',mesyuarat:'Tambah mesyuarat',dokumen:'Tambah dokumen',jawatankuasa:'Tambah guru',beruniform:'Tambah unit',kelab:'Tambah kelab',sukan:'Tambah sukan',rumah:'Tambah rumah sukan'};

  if(state.offline) return `<div class="ro">${svg('lock')}Pangkalan data tidak dapat disambung dalam paparan ini. Buka halaman ini melalui pautan Claude anda.</div>`;
  if(state.canWrite===false) return `<div class="ro">${svg('lock')}Anda boleh melihat data sahaja. Minta pemilik memberi akses Contributor untuk menambah atau mengemas kini.</div>`;
  if(state.db && typeof canArea==='function' && !state.isAdmin){ if(!canArea(curArea())) return `<div class="ro">${svg('lock')}${myRole()==='lihat'?'Peranan anda dalam hab ialah Lihat sahaja.':'Peranan anda tidak dibenarkan mengubah bahagian ini.'} Hubungi pentadbir jika perlu akses.</div>`; if(!ownUnitOk()) return `<div class="ro">${svg('lock')}Anda hanya boleh mengubah unit yang anda dilantik.${myGuruName()?'':' Minta pentadbir memadankan nama guru anda di Tetapan → Akses & peranan.'}</div>`; }
  return '';
}

/* ---------- generic section list ---------- */
function sortedRows(s){
  let rows = recs(s.id);
  const q = state.q.trim().toLowerCase();
  if(q) rows = rows.filter(r=>s.fields.some(f=>String(r[f.k]||'').toLowerCase().includes(q)) || String(r.tahun).includes(q));
  const sort = state.sort && state.sort.sec===s.id ? state.sort : {k: s.date || 'tahun', dir:'desc'};
  const f = s.fields.find(x=>x.k===sort.k);
  const isNum = ['tahun','_ahli','_lap','_peserta','_lamp'].includes(sort.k) || (f && f.type==='number');
  const val = (r,k) => k==='_ahli'?ahliCount(r) : k==='_lap'?reportsOf(r.id).length : k==='_peserta'?(r.peserta||[]).length : k==='_lamp'?(r.lampiran||[]).length : r[k];
  rows = rows.slice().sort((a,b)=>{
    let x=val(a,sort.k), y=val(b,sort.k);
    let c = isNum ? ((+x||0)-(+y||0)) : String(x||'').localeCompare(String(y||''),'ms',{numeric:true});
    if(c===0 && sort.k!==s.title) c = String(a[s.title]||'').localeCompare(String(b[s.title]||''),'ms');
    return sort.dir==='asc'?c:-c;
  });
  return {rows, sort};
}
function cell(s,f,r){
  if(f.k==='_ahli') return String(ahliCount(r));
  if(f.k==='_peserta'){ const p=r.peserta||[]; if(!p.length) return r.murid?esc(r.murid):'<span class="muted">–</span>';
    return esc(p.slice(0,2).map(x=>x.nama).join(', '))+(p.length>2?` <span class="pill pill-hue">+${p.length-2}</span>`:''); }
  if(f.k==='_lamp'){ const n=(r.lampiran||[]).length; return n?`<span class="pill pill-hue">${svg('clip').replace('<svg','<svg width="12" height="12"')} ${n}</span>`:'<span class="muted">–</span>'; }
  if(f.inline && editable()){ const cur=r[f.k]||''; const o=f.inline.slice(); if(cur&&!o.includes(cur)) o.unshift(cur);
    return `<select class="jsel${cur?' on':''}" data-rjaw="${esc(r.id)}" data-stop aria-label="${esc(f.label)}"><option value="">— Pilih jawatan —</option>${o.map(x=>`<option ${x===cur?'selected':''}>${esc(x)}</option>`).join('')}</select>`; }
  if(f.k==='_lap'){ const n=reportsOf(r.id).length; return state.year==='all'&&!state.rloaded?'–':String(n); }
  const v = r[f.k];
  if(v==null || v==='') return '<span class="muted">–</span>';
  if(f.type==='date') return esc(fmtDate(v));
  if(f.type==='url') return `<a class="lnk" href="${esc(v)}" target="_blank" rel="noopener" data-stop>Buka pautan</a>`;
  if(f.k==='peringkat') return `<span class="pill lvl-${esc(v)}">${esc(v)}</span>`;
  if(f.k==='bidang') return esc(v)+(r.unitNama?`<div class="sub">${esc(r.unitNama)}</div>`:'')+(r.jenis&&r.jenis!=='Pertandingan'?`<div class="sub">${esc(r.jenis)}</div>`:'');
  if(f.type==='textarea'){ const t=String(v); return esc(t.length>90?t.slice(0,90)+'…':t); }
  return esc(v);
}
function renderSection(s){
  const isUnit = UNIT_SECS.includes(s.id);
  const {rows, sort} = sortedRows(s);
  let cols = [{k:'tahun',label:'Tahun',type:'number'}, ...s.fields.filter(f=>f.col)];
  if(isUnit) cols.push({k:'_ahli',label:'Ahli',type:'number'});
  if(isUnit && s.id!=='rumah') cols.push({k:'_lap',label:'Laporan',type:'number'});
  if(s.peserta && !s.ringkas) cols.push({k:'_peserta',label:'Murid'});
  if(s.lampiran && !s.ringkas) cols.push({k:'_lamp',label:'Fail'});
  const total = recs(s.id).length;
  let body;
  if(!state.loaded){
    body = `<div class="empty"><p>Memuatkan rekod…</p></div>`;
  } else if(total===0){
    body = `<div class="empty"><div class="big-ic">${svg(s.id)}</div><h3>Belum ada rekod ${esc(s.name)} untuk ${yearLabel()}</h3>

function renderUnit(){
  const r = state.records.find(x=>x.id===state.unitId);
  if(!r){
    return `<section class="hero glass" style="--hue:var(--c-utama)"><div class="hero-text"><div class="eyebrow">Unit</div><h2>${state.loaded?'Unit tidak dijumpai':'Memuatkan…'}</h2>${state.loaded?'<p><a class="lnk" href="#utama">Kembali ke Papan Utama</a></p>':''}</div></section>`;
  }
  const s = SEC[r.sec];
  const all = memberList(r.id), act = activeMembers(r.id);
  const reps = reportsOf(r.id);
  const avg = reps.length ? Math.round(reps.reduce((a,x)=>a+(x.jumlah? (x.hadir||[]).length/x.jumlah : 0),0)/reps.length*100) : null;
  const jk = act.filter(m=>m.jawatan && m.jawatan!=='Ahli');
  const gU = guruUnit(r);
  const tabs = r.sec==='rumah' ? [['ahli','Ahli',act.length],['jk','Jawatankuasa',gU.length+jk.length],...(canDaftar(r)?[['daftar','Pendaftaran Atlet',olRumahCount(r.id)]]:[]),['info','Maklumat','']]
    : [['ahli','Ahli',act.length],['takwim','Takwim',(r.takwim||[]).length],['laporan','Laporan Perjumpaan',reps.length],['capai','Pencapaian',capaiOf(r.id).length],['jk','Jawatankuasa',gU.length+jk.length],['surat','Surat Kelulusan',(r.surat||[]).length],['info','Maklumat','']];
  if(!tabs.some(t=>t[0]===state.tab)) state.tab='ahli';
  let content='';
  if(state.tab==='ahli') content = unitMembers(r,s,all);
  else if(state.tab==='laporan') content = unitReports(r,s,reps,act);
  else if(state.tab==='takwim') content = unitTakwim(r,s,reps);
  else if(state.tab==='capai') content = unitCapai(r,s);
  else if(state.tab==='surat') content = unitSurat(r);
  else if(state.tab==='jk') content = unitCommittee(r,s,jk);
  else if(state.tab==='daftar') content = rumahDaftar(r);
  else content = unitInfo(r,s);
  return `
  <section class="hero glass" style="--hue:var(${s.hue})">
    <div class="big-ic">${svg(s.id)}</div>
    <div class="hero-text"><a class="back" href="#${s.id}">${svg('back').replace('<svg','<svg width="14" height="14"')}${esc(s.name)}</a>
      <div class="eyebrow">${esc(s.short)} · tahun ${esc(r.tahun)}</div><h2>${esc(r.nama)}</h2>
      <p>${[(r.guru||(gU[0]&&gU[0].nama))?((r.sec==='rumah'?'Ketua rumah: ':'Guru penasihat: ')+esc(r.guru||gU[0].nama)):'' , r.jadual?esc(r.jadual):'', r.warna?('Warna: '+esc(r.warna)):''].filter(Boolean).join(' · ')||'<span class="muted">Tambah guru penasihat dan jadual di tab Maklumat.</span>'}</p></div>
    ${(editable()||state.dl)?`<div class="hero-actions">${r.sec!=='rumah'&&editable()?`<button class="btn btn-main" data-newrep="${esc(r.id)}">${svg('mesyuarat')}Rekod kehadiran / laporan</button>`:''}${state.dl?`<button class="btn btn-ghost" data-sijiljk="${esc(r.id)}" style="--hue:var(--c-capai)">${svg('pencapaian')}Sijil jawatankuasa</button>`:''}${r.sec!=='rumah'&&state.dl?`<button class="btn btn-ghost" data-unitpdf="${esc(r.id)}">${svg('down')}Muat turun PDF unit</button>`:''}</div>`:''}
  </section>
  <div class="stats" style="--hue:var(${s.hue})">
    <div class="stat"><div class="v">${act.length}</div><div class="l">Ahli aktif</div></div>
    ${r.sec!=='rumah'?`<div class="stat"><div class="v">${reps.length}</div><div class="l">Laporan perjumpaan</div></div>
    <div class="stat"><div class="v">${avg==null?'–':avg+'%'}</div><div class="l">Purata kehadiran</div></div>`:`<div class="stat"><div class="v">${r.mata!=null&&r.mata!==''?esc(r.mata):'–'}</div><div class="l">Mata Hari Sukan</div></div>`}
    <div class="stat"><div class="v">${all.length-act.length}</div><div class="l">Pindah / berhenti</div></div>
  </div>
  <div class="tabs" role="tablist" style="--hue:var(${s.hue})">${tabs.map(t=>`<button class="tab" role="tab" data-tab="${t[0]}" aria-selected="${state.tab===t[0]}">${t[1]}${t[2]!==''?`<span class="n">${t[2]}</span>`:''}</button>`).join('')}</div>
  <section class="panel glass" style="--hue:var(${s.hue})">${roNote()}${content}</section>`;
}
const capaiOf = id => state.records.filter(x=>x.sec==='pencapaian' && x.unitId===id).sort((a,b)=>String(b.tarikh).localeCompare(String(a.tarikh)));
function unitTakwim(r,s,reps){
  const ed = editable(); const today = todayStr();

  const head = `<div class="toolbar"><span class="count">${items.length} aktiviti dirancang · ${items.filter(t=>reps.some(p=>p.tarikh&&p.tarikh===t.tarikh)).length} sudah dilaporkan</span><span style="margin-left:auto"></span>${ed?`<button class="btn btn-ghost btn-sm" data-smart="takwim" data-sctx="${esc(r.id)}" title="${SMART_HINT}">${svg('up')}Muat naik fail</button><button class="btn btn-main btn-sm" data-tknew="${esc(r.id)}">${svg('plus')}Tambah aktiviti</button>`:''}</div>`;
  if(!items.length) return head + `<div class="empty"><div class="big-ic">${svg('aktiviti')}</div><h3>Belum ada takwim</h3><p>Masukkan rancangan perjumpaan tahunan. Setiap aktiviti akan menunjukkan sama ada laporannya sudah dibuat.</p></div>`;

  ${items.map(t=>{ const rep = t.tarikh ? reps.find(p=>p.tarikh===t.tarikh) : null;
    const st = rep ? `<button class="pill pill-ok" style="border:0;cursor:pointer" data-viewrep="${esc(rep.id)}">Laporan Bil. ${esc(rep.bil)} ✓</button>`
      : !t.tarikh ? `<span class="pill pill-mute">Tarikh belum ditetapkan</span>`
      : t.tarikh>today ? `<span class="pill pill-mute">Akan datang</span>`
      : `<span class="pill pill-warn">Belum dilaporkan</span>${ed?` <button class="btn btn-ghost btn-sm" data-tkrep="${esc(t.id)}">Buat laporan</button>`:''}`;
    return `<tr class="click" data-tk="${esc(t.id)}" tabindex="0"><td data-label="Bil" class="num">${esc(t.bil)}</td><td data-label="Tarikh">${t.tarikh?`${esc(fmtDate(t.tarikh))}<div class="sub">${esc(hariOf(t.tarikh))}</div>`:`<span class="muted">${esc(t.catatan)||'–'}</span>`}</td><td data-label="Aktiviti" class="title-cell">${esc(t.aktiviti)}</td><td data-label="Status">${st}</td></tr>`; }).join('')}
  </tbody></table></div><p class="hint" style="margin:10px 0 0">Status dipadankan mengikut tarikh laporan perjumpaan. Ketik baris untuk mengemas kini aktiviti.</p>`;
}
function openTakwim(unitId, tid){
  const r = state.records.find(x=>x.id===unitId); if(!r) return; const s=SEC[r.sec]; const ed=editable();
  const list = (r.takwim||[]).map(x=>({...x})); const t = tid ? list.find(x=>x.id===tid) : null;
  const nextBil = list.length ? Math.max(...list.map(x=>+x.bil||0))+1 : 1;
  const fields=[{k:'bil',label:'Bil. perjumpaan',type:'number',req:1,half:1},{k:'tarikh',label:'Tarikh',type:'date',half:1},{k:'aktiviti',label:'Aktiviti',type:'text',req:1},{k:'catatan',label:'Catatan',type:'textarea'}];
  const form = openDrawer({hue:s.hue, eyebrow:r.nama+' · Takwim', title: t?(ed?'Kemas kini aktiviti':'Butiran aktiviti'):'Aktiviti takwim baharu',
    body: fieldsLayout(fields, f=> t ? (t[f.k]??'') : f.k==='bil'?nextBil:'', !ed),
    foot: ed?`${t?`<button type="button" class="btn btn-danger" data-del>Padam</button>`:''}<span class="sp"></span><button type="button" class="btn btn-ghost" data-close>Batal</button><button type="submit" class="btn btn-main">Simpan</button>`:`<span class="sp"></span><button type="button" class="btn btn-ghost" data-close>Tutup</button>`});
  const save = async (nl, msg) => { try{ await state.db.collection('records').doc(unitId).update({takwim:nl, updatedAt:new Date().toISOString()}); closeForm(); toast(msg); }catch(err){ ferr(writeErr(err)); } };
  form.addEventListener('submit', e=>{ e.preventDefault(); ferr(''); const out=readFields(form, fields); if(!out) return;
    const nl = t ? list.map(x=>x.id===t.id?{...x,...out}:x) : [...list, {id:'t'+uid(), ...out}];
    nl.sort((a,b)=>(a.tarikh||'9999').localeCompare(b.tarikh||'9999')||(+a.bil||0)-(+b.bil||0)); save(nl, t?'Takwim dikemas kini':'Aktiviti ditambah'); });
  const del=form.querySelector('[data-del]'); if(del) del.addEventListener('click',()=>askDelete(form,'Padam aktiviti takwim ini?',()=>save(list.filter(x=>x.id!==t.id),'Aktiviti dipadam')));
}

/* ---------- pupil compilation ---------- */
function classYear(){
  if(state.year!=='all') return +state.year;
  const ys = Object.values(state.members).map(m=>+m.tahun).filter(Boolean);
  return ys.length ? Math.max(...ys) : THIS_YEAR;
}
function compilePupils(Yarg){
  const Y = Yarg ? +Yarg : classYear();
  if(compilePupils.cache && compilePupils.cache.Y===Y && compilePupils.cache.m===state.members && compilePupils.cache.r===state.records) return compilePupils.cache.out;
  const map = new Map();
  state.records.filter(r=>UNIT_SECS.includes(r.sec) && +r.tahun===Y).forEach(r=>{
    memberList(r.id).forEach(m=>{
      const key = pkey(m);
      if(!map.has(key)) map.set(key,{key,nama:normNama(m.nama),kelas:normKelas(m.kelas),beruniform:[],kelab:[],sukan:[],rumah:[],past:[],pindah:null});
      const p = map.get(key);
      const a = {nama:r.nama,sec:r.sec,jawatan:m.jawatan&&m.jawatan!=='Ahli'?m.jawatan:'',unitId:r.id,mid:m.mid,status:m.status||'aktif'};
      if(a.status==='pindah'||a.status==='berhenti'){ p.past.push(a); if(a.status==='pindah' && !p.pindah) p.pindah={tarikh:m.tarikhStatus||'',ke:m.pindahKe||''}; }
      else p[r.sec].push(a);
    });
  });
  Object.entries(state.members).filter(([id,d])=>d.sec==='kelas' && +d.tahun===Y).forEach(([id,d])=>(d.list||[]).forEach(m=>{ const key=pkey(m);
    if(!map.has(key)) map.set(key,{key,nama:normNama(m.nama),kelas:normKelas(m.kelas),beruniform:[],kelab:[],sukan:[],rumah:[],past:[],pindah:null}); const p=map.get(key);
    if(m.status==='pindah'||m.status==='berhenti'){ p.past.push({nama:d.nama,sec:'kelas',unitId:id,mid:m.mid,status:m.status}); if(m.status==='pindah'&&!p.pindah) p.pindah={tarikh:m.tarikhStatus||'',ke:m.pindahKe||''}; } else { p.khas=true; if(kelasGroup(p.kelas)==='ppki') p.ppki={koko:m.koko||'', tahap:+m.tahap||0, rid:id, mid:m.mid}; } }));
  const all = [...map.values()].map(p=>{ const w=(kelasGroup(p.kelas) && !(p.ppki&&p.ppki.koko==='ya'&&p.ppki.tahap)) ? [] : wajib(effDarjah(p)); return {...p, wajib:w, gaps:w.filter(k=>!p[k].length), aktif:p.khas||UNIT_SECS.some(k=>p[k].length)}; });
  const pupils = all.filter(p=>p.aktif);
  const moved = all.filter(p=>!p.aktif && p.pindah).sort((a,b)=>String(b.pindah.tarikh).localeCompare(String(a.pindah.tarikh)));
  const out = {Y, pupils, moved};
  compilePupils.cache = {Y, m:state.members, r:state.records, out};
  return out;
}

/* ---------- PAJSK: kiraan markah (Garis Panduan PAJSK SR) ---------- */
const PJ_TERAS=[['beruniform','Unit Beruniform'],['kelab','Kelab & Persatuan'],['sukan','Sukan & Permainan']];
const PJ_KEH=[0,3.33,6.66,9.99,13.32,16.65,19.98,23.21,26.64,29.97,33.30,36.63,40];
const PJ_PENG={antarabangsa:20,kebangsaan:17,negeri:14,bahagian:12,daerah:11,zon:11};
const PJ_CAP={antarabangsa:[20,19,18,17,16],kebangsaan:[17,16,15,14,13],negeri:[14,13,12,11,10],bahagian:[11,10,9,8,7],daerah:[11,10,9,8,7],zon:[11,10,9,8,7],sekolah:[8,7,6,5,4]};
const PJ_KOM=[['Menunjukkan kepimpinan',3],['Mengurus aktiviti',3],['Membantu guru atau rakan',2],['Menyedia peralatan',2],['Mengemas peralatan',2],['Membersih kawasan',2],['Menepati waktu',2],['Menunjukkan minat',2],['Menunjukkan kesungguhan',2],['Mengikut arahan',2],['Mencuba',2],['Memberi kerjasama',2],['Nilai murni lain yang boleh diperhatikan',2]];
const PJ_KHS={atlet:[10,'Atlet / peserta program, pertandingan, karnival atau kursus'],teknikal:[10,'Kemahiran khusus (pengadil, jurulatih, teknikal)'],persembahan:[8,'Persembahan (cth. persembahan selingan)'],sokongan:[5,'Sokongan (perbarisan, sorak, penyokong)']};
const PJ_EKS=['Perkhidmatan','Anugerah khas','Khidmat masyarakat','NILAM','Tugas-tugas khas'];
const r2=n=>Math.round(n*100)/100;
function pjLvl(s){ s=String(s||'').toLowerCase(); return /antarabangsa/.test(s)?'antarabangsa':/kebangsaan|mssm|kpm/.test(s)?'kebangsaan':/negeri|mssj|jpn/.test(s)?'negeri':/bahagian/.test(s)?'bahagian':/daerah|mssd|ppd/.test(s)?'daerah':/zon/.test(s)?'zon':/sekolah/.test(s)?'sekolah':''; }
function pjJaw(j,sec){ j=String(j||'Ahli').toLowerCase(); const pbb=sec==='beruniform';
  if(/ahli aktif/.test(j)) return 4;
  if(/^ahli$|ahli biasa|ahli berdaftar/.test(j)) return 2;
  if(/\bajk\b|jawatankuasa/.test(j)) return pbb?5:6;
  if(/penolong setiausaha|naib setiausaha|naib bendahari|penolong bendahari/.test(j)) return 6;
  if(/penolong ketua pasukan|penolong ketua patrol|penolong kapten/.test(j)) return pbb?6:8;
  if(/ketua pasukan|ketua patrol|kapten/.test(j)) return pbb?7:10;
  if(/setiausaha|bendahari/.test(j)) return pbb?7:8;
  if(/naib|timbalan|penolong ketua/.test(j)) return 8;
  if(/pengerusi|presiden|ketua/.test(j)) return 10;
  return 2; }
function pjPlace(k){ k=String(k||'').toLowerCase(); return /naib/.test(k)?2:/johan/.test(k)?1:/ketiga/.test(k)?3:/keempat/.test(k)?4:/kelima/.test(k)?5:0; }
function pjCfg(){ const c=cfg().pajsk||{}; return {komitmen:Math.min(10,+c.komitmen||0), khidmat:Math.min(10,+c.khidmat||0)}; }
function pjOv(p){ return (state.pjOv||{})[p.key]||null; }
function olResultsFor(key){ const out=[]; (state.olAcara||[]).forEach(a=>{ if(a.format==='kelayakan'||a.terbuka) return; (a.keputusan||[]).forEach(k=>{ if((k.peserta||[]).some(x=>pkey(x)===key)) out.push({a, tempat:k.tempat}); }); }); return out; }
function pjUnit(p,a,sec){
  const C=pjCfg(); const ov=pjOv(p)||{}; const L=linkIndex().get(p.key)||{pencapaian:[],aktiviti:[]};
  const u=state.records.find(r=>r.id===a.unitId)||{nama:a.nama}; const un=String(u.nama||'').toLowerCase();
  const caps=L.pencapaian.filter(r=>r.unitId===a.unitId || (!r.unitId && BIDANG_SEC[r.bidang]===sec));
  const akts=L.aktiviti.filter(r=>r.unit && un && String(r.unit).toLowerCase().includes(un));
  const ol = sec==='sukan' ? olResultsFor(p.key) : [];
  let P=0, pN=''; [...caps,...akts].forEach(r=>{ const v=PJ_PENG[pjLvl(r.peringkat)]||0; if(v>P){ P=v; pN=`${r.peringkat} · ${r.pertandingan||r.nama||''}`; } });
  let Cp=0, cpN=''; caps.forEach(r=>{ if(r.jenis && r.jenis!=='Pertandingan') return; const pl=pjPlace(r.keputusan); const t=PJ_CAP[pjLvl(r.peringkat)]; if(!pl||!t) return; if(pl>3 && sec!=='sukan') return; const v=t[pl-1]||0; if(v>Cp){ Cp=v; cpN=`${r.keputusan} ${r.peringkat} · ${r.pertandingan||''}`; } });
  ol.forEach(x=>{ const max=x.a.format==='kumpulan'?3:5; if(x.tempat>max) return; const v=PJ_CAP.sekolah[x.tempat-1]||0; if(v>Cp){ Cp=v; cpN=`Tempat ${x.tempat} ${x.a.nama} (Olahraga sekolah)`; } });
  const att=attendanceOf(a.unitId,a.mid); const H=PJ_KEH[Math.min(12,att.hadir)];
  const kom=(ov.komitmen||{})[a.unitId]; const K = Array.isArray(kom) ? Math.min(10, kom.slice(0,4).reduce((s,i)=>s+((PJ_KOM[i]||[])[1]||0),0)) : C.komitmen;
  const ksv=(ov.khidmat||{})[a.unitId]; const autoS = caps.length||akts.length||ol.length; const S = ksv ? ((PJ_KHS[ksv]||[0])[0]) : autoS ? 10 : C.khidmat;
  const J=pjJaw(a.jawatan,sec);
  return {sec, unit:u.nama||a.nama, unitId:a.unitId, jawatan:a.jawatan||'Ahli', J, P, pN, K, kSet:Array.isArray(kom), S, sSrc:ksv?'guru':autoS?'auto':'lalai', hadir:att.hadir, sesi:att.total, H, C:Cp, cpN, total:r2(J+P+K+S+H+Cp)};
}
function pjGred(m){ return m>=80?'A':m>=60?'B':m>=40?'C':m>=20?'D':'E'; }
function pjPupil(p){
  const o={}; PJ_TERAS.forEach(([sec])=>{ const l=(p[sec]||[]).map(a=>pjUnit(p,a,sec)).sort((x,y)=>y.total-x.total); o[sec]=l[0]||null; });
  const marks=PJ_TERAS.map(([s])=>o[s]?o[s].total:0).sort((a,b)=>b-a); const avg=r2((marks[0]+marks[1])/2);
  const ov=pjOv(p)||{}; const E=Math.min(10,+((ov.ekstra||{}).markah)||0);
  const kec=!!(p.ppki&&p.ppki.koko==='kecuali'); const tl=kec||!PJ_TERAS.some(([s])=>o[s]); const gpa=kec?0:r2(Math.min(100,avg+E));
  return {...o, avg:kec?0:avg, E:kec?0:E, eN:(ov.ekstra||{}).elemen||'', gpa, gred:tl?'TL':pjGred(gpa), tl, kec};
}
function effDarjah(p){ return (p&&p.ppki&&p.ppki.tahap) ? +p.ppki.tahap : darjahOf(p.kelas); }
function pjEligible(p){ if(!p||p.pindah) return false; if(p.ppki) return p.ppki.koko==='ya' && p.ppki.tahap>=4 && p.ppki.tahap<=6; return !kelasGroup(p.kelas) && darjahOf(p.kelas)>=4 && darjahOf(p.kelas)<=6; }
function pjPupils(){ const {pupils}=compilePupils(); return pupils.filter(pjEligible).sort(cmpMurid); }
function pjSummary(){
  if(pjSummary.c && pjSummary.c.r===state.records && pjSummary.c.m===state.members && pjSummary.c.p===state.reports && pjSummary.c.o===state.pjOv && pjSummary.c.a===state.olAcara && pjSummary.c.g===state.cfg && pjSummary.c.k===state.pjRek) return pjSummary.c.v;
  const Yc=classYear(); const rows=pjPupils().map(p=>{ const r=pjPupil(p); return {p, r, cg:pjCgpa(p, r, Yc)}; });
  const Y=classYear(); const units=state.records.filter(r=>['beruniform','kelab','sukan'].includes(r.sec) && +r.tahun===Y).map(u=>({u, n:reportsOf(u.id).length, ahli:activeMembers(u.id).filter(m=>darjahOf(normKelas(m.kelas))>=4).length})).filter(x=>x.ahli>0).sort((a,b)=>a.n-b.n);
  const v={rows, units}; pjSummary.c={r:state.records,m:state.members,p:state.reports,o:state.pjOv,a:state.olAcara,g:state.cfg,k:state.pjRek,v}; return v;
}
function pjCgCell(x){ const c=x.cg; if(c.cgpa==null) return '–'; const prev=c.chain.filter(z=>!z.live); const tip=c.chain.filter(z=>z.gpa!=null).map(z=>`T${z.darjah} (${z.tahun}): ${z.gpa}`).join(' → ');
  return `<b title="${esc(tip)}">${c.cgpa}</b>${prev.length?`<div class="sub">${esc(prev.map(z=>'T'+z.darjah+' '+(z.gpa??'–')).join(' · '))}</div>`:''}${c.missing.length?`<div class="sub" style="color:var(--warn)">Tiada T${c.missing.join(', T')}</div>`:''}`; }
function pjCell(x){ if(!x) return `<span class="pill pill-warn">Tiada unit</span>`;
  return `<div class="pjc"><b>${x.total}</b><span class="sub">/110</span></div><div class="sub">${esc(x.unit)}</div><div class="pjb">J${x.J} · P${x.P} · K${x.K}${x.kSet?'':'<sup>*</sup>'} · S${x.S}${x.sSrc==='lalai'?'<sup>*</sup>':''} · H${x.H} <span class="${x.hadir<6?'pj-warn':''}">(${x.hadir}/${Math.max(12,x.sesi)})</span> · C${x.C}</div>`; }
function renderPajskKira(){
  const s=SEC.pajsk; const {rows, units}=pjSummary();
  if(!rows.length) return `<section class="panel glass" style="--hue:var(${s.hue})"><div class="empty"><p>Tiada murid Tahun 4–6 untuk tahun ini.</p></div></section>`;
  const cls=[...new Set(rows.map(x=>x.p.kelas))].sort(cmpKelas);
  const G={A:0,B:0,C:0,D:0,E:0,TL:0}; rows.forEach(x=>G[x.r.gred]++); const avgAll=r2(rows.reduce((a,x)=>a+x.r.gpa,0)/rows.length);
  const noUnit=rows.filter(x=>PJ_TERAS.some(([k])=>!x.r[k])); const low=rows.filter(x=>['D','E','TL'].includes(x.r.gred));
  const lowAtt=rows.filter(x=>PJ_TERAS.some(([k])=>x.r[k] && x.r[k].hadir<6)); const fewRep=units.filter(x=>x.n<12);
  const list=(arr,fmt)=> arr.length ? `<ul class="pjlist">${arr.slice(0,8).map(fmt).join('')}</ul>${arr.length>8?`<div class="sub">dan ${arr.length-8} lagi</div>`:''}` : '<p class="sub" style="margin:4px 0 0">Tiada.</p>';
  const kl = cls.includes(state.pjKelas) ? state.pjKelas : (state.pjKelas==='__all'?'__all':cls[0]);
  let ps = kl==='__all' ? rows : rows.filter(x=>x.p.kelas===kl);
  const f=state.pjF||'all'; if(f==='low') ps=ps.filter(x=>['D','E','TL'].includes(x.r.gred)); else if(f==='nounit') ps=ps.filter(x=>PJ_TERAS.some(([k])=>!x.r[k])); else if(f==='att') ps=ps.filter(x=>PJ_TERAS.some(([k])=>x.r[k]&&x.r[k].hadir<6));
  const C=pjCfg(); const adm=state.isAdmin; const ed=editable();
  return `<div class="stats" style="--hue:var(${s.hue})">
    <div class="stat"><div class="v">${rows.length}</div><div class="l">Murid Tahun 4–6${(()=>{ const n=compilePupils().pupils.filter(p=>p.ppki&&p.ppki.koko==='kecuali'&&p.ppki.tahap>=4&&!p.pindah).length; return n?`<br><span class="sub">${n} murid PPKI dikecualikan, tidak dikira</span>`:''; })()}</div></div>
    <div class="stat"><div class="v">${avgAll}</div><div class="l">Purata markah</div></div>
    <div class="stat pjdist"><div class="gr">${['A','B','C','D','E','TL'].filter(g=>g!=='TL'||G.TL).map(g=>`<button type="button" class="pjg g${g}" data-pjg="${g}" title="Lihat murid gred ${g}"><b>${G[g]}</b><small>${g}</small></button>`).join('')}</div><div class="l">Taburan gred · ketik untuk senarai murid</div></div>
  </div>
  <section class="panel glass" style="--hue:var(${s.hue})"><h3>Perlu perhatian <span class="sub">ketik kad untuk melihat senarai</span></h3>
    <div class="pjcards">${[['rep',fewRep.length,'Unit kurang 12 laporan','Kehadiran penuh perlukan 12 perjumpaan'],['nounit',noUnit.length,'Murid tanpa unit','Dalam sekurang-kurangnya satu teras'],['low',low.length,'Gred D, E atau TL','Markah bawah 40'],['att',lowAtt.length,'Kehadiran rendah','Hadir kurang 6 perjumpaan']].map(([k,n,t,d])=>`<button class="pjcard${n?' warn':''}" data-pjwatch="${k}"><span class="v">${n}</span><span class="t">${t}</span><span class="d">${d}</span></button>`).join('')}</div></section>
  <section class="panel glass" style="--hue:var(${s.hue})">
    <div class="toolbar" style="gap:6px">${cls.map(c=>`<button class="chip" data-pjkelas="${esc(c)}" aria-pressed="${c===kl}">${esc(c)}</button>`).join('')}<button class="chip" data-pjkelas="__all" aria-pressed="${kl==='__all'}">Semua</button></div>
    <div class="toolbar" style="gap:6px;margin-top:6px">${[['all','Semua murid'],['low','Gred D/E/TL'],['nounit','Tiada unit'],['att','Kehadiran rendah']].map(([k,n])=>`<button class="chip" data-pjf="${k}" aria-pressed="${f===k}">${n}</button>`).join('')}<span class="sp" style="flex:1"></span>${state.dl?`<button class="btn btn-main btn-sm" data-pjxls="kelas">${svg('down')}Excel ${kl==='__all'?'semua':esc(kl)}</button><button class="btn btn-ghost btn-sm" data-pjxls="all">${svg('down')}Excel semua Tahun 4–6</button>`:''}</div>
    <div class="tablewrap cards" style="margin-top:10px"><table class="pjtab"><thead><tr><th>Bil</th><th>Nama murid</th>${PJ_TERAS.map(t=>`<th>${t[1]}</th>`).join('')}<th>Purata 2 terbaik</th><th>Ekstra</th><th>GPA ${classYear()}</th><th>CGPA</th><th>10%</th></tr></thead><tbody>
    ${ps.map((x,i)=>`<tr class="${ed?'click':''}" data-pjp="${esc(x.p.key)}" tabindex="0"><td class="num" data-label="Bil">${i+1}</td><td class="title-cell" data-label="Nama">${esc(x.p.nama)}${kl==='__all'||x.p.ppki?`<div class="sub">${esc(x.p.kelas)}${x.p.ppki?` · setara Tahun ${x.p.ppki.tahap}${x.r.kec?' · dikecualikan':''}`:''}</div>`:''}</td>${PJ_TERAS.map(([k,n])=>`<td data-label="${esc(n)}">${pjCell(x.r[k])}</td>`).join('')}<td data-label="Purata 2 terbaik" class="num">${x.r.avg}</td><td data-label="Ekstra" class="num">${x.r.E}</td><td data-label="GPA"><span class="pjg g${x.r.gred}">${x.r.gpa}</span> <b>${x.r.gred}</b></td><td data-label="CGPA" class="num">${pjCgCell(x)}</td><td data-label="10%" class="num">${x.cg.p10??'–'}</td></tr>`).join('')||'<tr><td colspan="10"><span class="sub">Tiada murid untuk pilihan ini.</span></td></tr>'}
    </tbody></table></div>
    <p class="hint" style="margin:10px 0 0">J jawatan (10) · P peringkat penglibatan (20) · K komitmen (10) · S khidmat sumbangan (10) · H kehadiran, bilangan perjumpaan dihadiri (40) · C pencapaian (20). <sup>*</sup> markah lalai, belum diisi guru. ${ed?'Ketik nama murid untuk mengisi komitmen, khidmat sumbangan dan ekstra kurikulum.':''} Markah = purata dua teras terbaik + ekstra kurikulum (Jadual 18). Gred: A 80–100, B 60–79, C 40–59, D 20–39, E bawah 20.</p>

function route(){
  const h = (location.hash||'').slice(1);
  if(h.startsWith('u-')){
    const id = h.slice(2);
    if(state.unitId!==id){ state.mq=''; state.showPindah=false; if(!route.keepTab) state.tab='ahli'; }
    state.sec='unit'; state.unitId=id;
    const r = state.records.find(x=>x.id===id); render.navSec = r ? r.sec : null;
  } else {
    if(h==='data'){ state.setTab='data'; }
    const next = h==='data' ? 'tetapan' : h==='tv' ? 'tv' : SEC[h] ? h : 'utama';
    if(next!==state.sec){ state.q=''; }
    state.sec = next; state.unitId=null;
  }
  route.keepTab=false;
  render.scrollNav = true; render();
}

/* ---------- drawer helpers ---------- */
function openDrawer({hue, eyebrow, title, body, foot, wide}){
  const ov=$('overlay');
  ov.innerHTML = `<form class="drawer${wide?' wide':''}" id="form" style="--hue:var(${hue})" novalidate>
    <div class="dhead"><div class="t"><span class="eyebrow">${esc(eyebrow)}</span><h3>${esc(title)}</h3></div><button type="button" class="btn btn-ghost" data-close aria-label="Tutup">${svg('close')}</button></div>
    <div class="dbody">${body}<div id="ferr" class="sub" style="color:var(--danger)" hidden></div></div>
    <div class="dfoot">${foot}</div></form>`;
  ov.hidden=false; document.body.style.overflow='hidden';
  const form=$('form');
  form.addEventListener('click',e=>{ if(e.target.closest('[data-close]')) closeForm(); });
  return form;
}
function closeForm(){ if(closeForm.hook){ const h=closeForm.hook; closeForm.hook=null; try{h();}catch(e){} } $('overlay').hidden=true; $('overlay').innerHTML=''; document.body.style.overflow=''; }
$('overlay').addEventListener('click',e=>{ if(e.target.id==='overlay') closeForm(); });
document.addEventListener('keydown',e=>{ if(e.key==='Escape' && !$('overlay').hidden) closeForm(); });
function ferr(msg){ const el=$('ferr'); if(!el) return; el.textContent=msg; el.hidden=!msg; }
function askDelete(form, text, onYes){
  const foot=form.querySelector('.dfoot');
  foot.innerHTML=`<div class="confirm"><span>${esc(text)}</span><span style="margin-left:auto"></span><button type="button" class="btn btn-ghost" data-close>Batal</button><button type="button" class="btn btn-danger" data-yes>Ya, padam</button></div>`;
  foot.querySelector('[data-yes]').addEventListener('click', onYes);
}
function writeErr(e){
  if(e&&(e.code==='invalid_argument'||e.code==='permission-denied')){ return IS_SA?'Akaun anda tidak dibenarkan menyimpan. Minta pentadbir hab menyemak peranan anda.':'Akaun anda tidak dibenarkan menyimpan. Minta pemilik hab memberi akses Contributor.'; }
  if(e&&e.code==='quota_exceeded') return 'Ruang simpanan penuh. Padam rekod lama yang tidak diperlukan.';
  return 'Tidak dapat disimpan. Semak sambungan internet dan cuba lagi.';
}

function fieldHtml(f, v, dis){
  const id='f_'+f.k, req=f.req?' required':'', ro = dis ? ' disabled':'';
  let ctl;
  if(f.type==='textarea') ctl=`<textarea id="${id}" name="${f.k}"${req}${ro}>${esc(v)}</textarea>`;
  else if(f.type==='gurus') return `<div class="field"><label for="gpick">${esc(f.label)}</label><div class="chips" id="gchips"></div>${dis?'':`<input id="gpick" type="search" placeholder="Klik untuk pilih nama guru, atau taip untuk cari…" autocomplete="off"><div class="presults gres" id="gresults" hidden></div><span class="hint">Boleh pilih lebih daripada seorang guru.</span>`}</div>`;
  else if(f.type==='select'){ const base = typeof f.options==='function' ? f.options() : f.options; const opts = v && !base.includes(v) ? [v,...base] : base; ctl=`<select id="${id}" name="${f.k}"${req}${ro}><option value="">— Pilih —</option>${opts.map(o=>`<option ${o===v?'selected':''}>${esc(o)}</option>`).join('')}</select>`; }
  else if(f.type==='guru1'){ const base=allGuruNames().slice().sort((a,b)=>a.localeCompare(b,'ms')); const opts = v && !base.includes(v) ? [v,...base] : base;

function fieldsLayout(fields, valOf, dis){

    else { if(pend.length){ parts.push(`<div class="frow">${pend.join('')}</div>`); pend=[]; } parts.push(h); }

/* Excel / CSV upload */
let XLSXready=null;
function loadXLSX(){
  if(window.XLSX) return Promise.resolve();
  if(XLSXready) return XLSXready;
  XLSXready = new Promise((res,rej)=>{ const sc=document.createElement('script'); sc.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js'; sc.onload=res; sc.onerror=()=>{XLSXready=null;rej();}; document.head.appendChild(sc); });
  return XLSXready;
}
let pickCb=null;
let pickKind='ahli';
function pickFile(cb, kind){ pickCb=cb; pickKind=kind||'ahli'; loadXLSX().catch(()=>{}); $('xfile').value=''; $('xfile').click(); }
function startUpload(unitId){ pickFile((items,f)=>previewUpload(unitId,items,f)); }
$('xfile').addEventListener('change', async e=>{
  const file=e.target.files[0]; if(!file||!pickCb) return;
  if(!isSheet(file.name)){ smartListFiles(pickKind, [file], pickCb); return; }
  try{
    await loadXLSX();
    const wb = XLSX.read(await file.arrayBuffer(), {type:'array'});
    const rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], {header:1, defval:'', raw:false});
    const parsed = parseRows(rows);
    if(parsed.error){ smartListFiles(pickKind, [file], pickCb); return; }
    pickCb(parsed.items, file.name);
  }catch(err){ toast('Fail tidak dapat dibaca. Gunakan .xlsx atau .csv.'); }
});
function parseRows(rows){
  let hi=-1, cols={};
  for(let i=0;i<Math.min(rows.length,15);i++){
    const r=rows[i].map(c=>String(c).trim().toLowerCase());
    const n=r.findIndex(c=>/^nama/.test(c)||c==='name');
    if(n>=0){ hi=i; cols.nama=n;
      cols.kelas=r.findIndex(c=>/^(kelas|class)/.test(c));
      cols.tahun=r.findIndex(c=>/^(tahun|darjah|year)$/.test(c));
      cols.jawatan=r.findIndex(c=>/^(jawatan|post|position)/.test(c));
      cols.unit=r.findIndex(c=>/^(unit|kelab|persatuan|sukan|bidang)/.test(c));
      break; }
  }
  if(hi<0) return {error:'Lajur “Nama” tidak dijumpai. Pastikan baris pertama ada tajuk Nama dan Kelas.'};
  const items=[];
  for(const r of rows.slice(hi+1)){
    const nama=normNama(r[cols.nama]); if(!nama) continue;
    let kelas = cols.kelas>=0 ? String(r[cols.kelas]||'').trim() : '';
    if(cols.tahun>=0 && r[cols.tahun] && !/^\d/.test(kelas)) kelas = String(r[cols.tahun]).replace(/\D/g,'')+' '+kelas;
    items.push({nama, kelas:normKelas(kelas), jawatan: cols.jawatan>=0 ? (String(r[cols.jawatan]||'').trim()||'Ahli') : 'Ahli', rawJawatan: cols.jawatan>=0 ? String(r[cols.jawatan]||'').trim() : '', unit: cols.unit>=0 ? String(r[cols.unit]||'').trim() : ''});
  }
  if(!items.length) return {error:'Tiada nama murid dijumpai dalam fail.'};
  return {items};
}
function previewUpload(unitId, items, fname){

/* ---------- teachers grouped ---------- */
function guruKey(n){
  return String(n||'').toLowerCase().replace(/[.,'’`]/g,' ')
    .replace(/\b(cikgu|cg|ustazah|ustaz|hjh|hj|haji|hajah|hajjah|pn|puan|en|encik|dr|tn)\b/g,' ')
    .replace(/\bbt\b|\bbte\b/g,'binti').replace(/\bb\b/g,'bin').replace(/@\s*/g,'@').replace(/\s+/g,' ').trim();
}
function groupGuru(rows){
  const m = new Map();
  rows.forEach(r=>{ const k=guruKey(r.nama); if(!k) return;
    if(!m.has(k)) m.set(k,{key:k,nama:r.nama,roles:[]});
    const g=m.get(k); if(String(r.nama).length>String(g.nama).length) g.nama=r.nama; g.roles.push(r); });
  const rank = j => { const i=JAWATAN.indexOf(j); return i<0?99:i; };
  return [...m.values()].map(g=>({...g, roles:g.roles.sort((a,b)=>rank(a.jawatan)-rank(b.jawatan)||String(a.unit||'').localeCompare(String(b.unit||''),'ms'))}))
    .sort((a,b)=>a.nama.localeCompare(b.nama,'ms'));
}
function guruView(s){

  if(q) gs = gs.filter(g=>g.nama.toLowerCase().includes(q) || g.roles.some(r=>[r.jawatan,r.unit,r.tugas].join(' ').toLowerCase().includes(q)));
  const role = r => `<b>${esc(r.unit||r.jawatan||'Belum dilantik')}</b><span class="j">${esc([r.unit?r.jawatan:'', r.tugas].filter(Boolean).join(' · ')||(r.unit?'Jawatan belum dipilih':''))}</span>`;
  const html = gs.length ? `<div class="tablewrap cards"><table><thead><tr><th>Bil</th><th>Nama guru</th><th>Jawatan & unit</th><th>Bil. jawatan</th></tr></thead><tbody>
    ${gs.map((g,i)=>`<tr><td data-label="Bil" class="num">${i+1}</td><td data-label="Nama" class="title-cell"><button class="linkbtn" data-guru="${esc(g.key)}">${esc(g.nama)}</button></td>
      <td data-label="Jawatan"><div class="aff" style="gap:6px">${g.roles.map(r=>`<div class="aff">${role(r)}</div>`).join('')}</div></td>
      <td data-label="Bil. jawatan" class="num">${g.roles.length}</td></tr>`).join('')}
  </tbody></table></div>
  <p class="hint" style="margin:10px 0 0">Ketik nama guru untuk melihat dan mengemas kini semua jawatannya. Nama dengan gelaran berbeza (Cikgu, Hjh, Ustazah) digabungkan sebagai seorang guru.</p>`
    : `<div class="empty"><p>Tiada guru sepadan dengan carian “${esc(state.q)}”.</p></div>`;
  return {html, n: groupGuru(recs('jawatankuasa')).length};
}

async function applyPupilChanges(changes, onStep){
  // changes: [{key, nama, kelas}] — key = pkey lama; nama/kelas = nilai baharu
  const Y=classYear(); const M=new Map(changes.filter(c=>c&&c.key).map(c=>[c.key,{nama:normNama(c.nama), kelas:normKelas(c.kelas)}]));
  if(!M.size) return 0; const now=new Date().toISOString(); let n=0; const step=()=>{ n++; if(onStep) onStep(n); };
  const fix = o => { const c=M.get(pkey(o)); return c ? {...o, nama:c.nama, kelas:c.kelas} : o; };
  // 1. senarai ahli (unit, rumah, kelas khas)
  for(const [id,d] of Object.entries(state.members)){ if(+d.tahun!==Y) continue; let ch=false; const list=(d.list||[]).map(m=>{ const f=fix(m); if(f!==m) ch=true; return f; }); if(ch){ await saveMemDoc(id,list); step(); } }
  // 2. pendaftaran olahraga
  for(const d of (state.olDaftar||[])){ let ch=false; const at={}; Object.entries(d.atlet||{}).forEach(([k,v])=>{ const c=M.get(k); if(c){ ch=true; at[pkey(c)]={...v, nama:c.nama, kelas:c.kelas}; } else at[k]=v; }); if(ch){ await state.db.collection('olahraga_daftar').doc(d.id).update({atlet:at, updatedAt:now}); step(); } }
  // 3. keputusan olahraga
  for(const a of (state.olAcara||[])){ let ch=false; const ks=(a.keputusan||[]).map(k=>{ const ps=(k.peserta||[]).map(p=>{ const f=fix(p); if(f!==p) ch=true; return f; }); return {...k, peserta:ps}; }); if(ch){ await state.db.collection('olahraga_acara').doc(a.id).update({keputusan:ks, updatedAt:now}); step(); } }
  // 4. pencapaian & aktiviti
  for(const r of state.records){ if(!['pencapaian','aktiviti'].includes(r.sec) || !(r.peserta||[]).length) continue; let ch=false; const ps=r.peserta.map(p=>{ const f=fix(p); if(f!==p) ch=true; return f; }); if(ch){ await state.db.collection('records').doc(r.id).update({peserta:ps, updatedAt:now}); step(); } }
  // 5. markah PAJSK yang diisi guru
  for(const [k,v] of Object.entries(state.pjOv||{})){ const c=M.get(k); if(!c) continue; const nk=pkey(c); const oldId=('p'+Y+'-'+k).replace(/[^A-Za-z0-9_\-.~:@+]/g,'-').slice(0,180); const newId=('p'+Y+'-'+nk).replace(/[^A-Za-z0-9_\-.~:@+]/g,'-').slice(0,180);
    await state.db.collection('pajsk').doc(newId).set({...v, key:nk, nama:c.nama, kelas:c.kelas, updatedAt:now}); if(newId!==oldId){ try{ await state.db.collection('pajsk').doc(oldId).delete(); }catch(e){} } step(); }
  compilePupils.cache=null; return M.size;
}

function enrolParse(wb){
  const out=[]; const klRe=/^(\d\s*[a-z]+|tahun\s*\d.*|tingkatan\s*\d.*|prasekolah.*|pra\s*ppki.*|pendidikan\s+khas.*|ppki.*)$/i;
  wb.SheetNames.forEach(sn=>{ const R=xRows(wb.Sheets[sn]); let nI=-1, kI=-1, title='';
    R.forEach((row,ri)=>{ const cells=(row||[]).map(XS);
      const h=cells.findIndex(c=>/^nama(\s+murid|\s+penuh|\s+peserta)?$/i.test(c));
      if(h>=0){ nI=h; kI=cells.findIndex(c=>/^kelas$/i.test(c)); return; }
      const t=cells.filter(Boolean); if(t.length===1 && klRe.test(t[0].replace(/\s+/g,' ').trim()) && !/tahun\s*20\d\d/i.test(t[0])){ title=t[0]; nI=-1; return; }
      if(nI<0) return; const nm=normNama(cells[nI]||''); if(!nm || nm.length<4 || /^\d+$/.test(nm) || /^(jumlah|lelaki|perempuan)/i.test(nm)) return;
      const kl=kI>=0?cells[kI]:(title||sn); out.push({nama:nm.toUpperCase(), kelas:normKelas(String(kl).replace(/^pendidikan\s+(?!khas)/i,'Pendidikan Khas '))}); });
  });
  return out;

  rows.forEach(r=>{ let p=null, fuzzy=false; const ex=byName.get(r.nama)||[]; if(ex.length===1) p=ex[0]; else if(ex.length>1) p=ex.find(x=>x.kelas===r.kelas)||ex[0];
    if(!p){ let best=null, bs=0, second=0; pupils.forEach(x=>{ if(used.has(x.key)) return; const d=xDice(x.nama.toUpperCase(), r.nama); if(d>bs){ second=bs; bs=d; best=x; } else if(d>second) second=d; }); if(best && bs>=0.9 && bs-second>0.03){ p=best; fuzzy=true; } }
    if(!p){ baru.push(r); return; } used.add(p.key);
    if(p.kelas!==r.kelas || (fuzzy && p.nama.toUpperCase()!==r.nama)) change.push({p, nama:fuzzy?r.nama:p.nama, kelas:r.kelas, fuzzy}); else sama.push(p); });

}

function initPeserta(form, initial, ed){
  let sel = (initial||[]).map(x=>({nama:x.nama,kelas:x.kelas}));
  const yr = () => { const v=+((form.querySelector('#f_tahun')||{}).value); return v||classYear(); };
  const pool = () => compilePupils(yr()).pupils;
  const chips = form.querySelector('#pchips'), cnt=form.querySelector('#pcount'), inp=form.querySelector('#psearch'), res=form.querySelector('#presults');
  const has = k => sel.some(x=>pkey(x)===k);
  const draw = () => {
    const keys = new Set(pool().map(p=>p.key));
    cnt.textContent = sel.length+' murid';
    chips.innerHTML = sel.length ? sel.map((x,i)=>`<span class="pchip${keys.has(pkey(x))?'':' loose'}">${esc(x.nama)} <small>${esc(x.kelas||'tiada kelas')}</small>${ed?`<button type="button" data-prm="${i}" aria-label="Buang ${esc(x.nama)}">${svg('close').replace('<svg','<svg width="12" height="12"')}</button>`:''}</span>`).join('') : '<span class="muted">Belum ada murid dipilih.</span>';
  };
  const search = () => {
    if(!res) return; const q=inp.value.trim(); if(q.length<2){ res.innerHTML=''; return; }
    const ps = pool(); const ql=q.toLowerCase(); const kq=normKelas(q);
    const cls = ps.filter(p=>p.kelas.toLowerCase()===kq.toLowerCase());
    const hits = ps.filter(p=>p.nama.toLowerCase().includes(ql) && !has(p.key)).slice(0,8);
    let h='';
    if(cls.length) h+=`<button type="button" data-pcls="${esc(cls[0].kelas)}"><b>Tambah semua murid ${esc(cls[0].kelas)}</b><span class="k">${cls.length} murid</span></button>`;
    h+=hits.map(p=>`<button type="button" data-padd="${esc(p.key)}"><span>${esc(p.nama)}</span><span class="k">${esc(p.kelas)}</span></button>`).join('');
    if(!cls.length && q.length>=3) h+=`<button type="button" data-pfree><span>Tambah “${esc(q)}”</span><span class="k">tiada dalam senarai</span></button>`;
    res.innerHTML = h || '<p class="hint" style="margin:0">Tiada murid sepadan.</p>';
  };
  draw();
  if(ed){
    inp.addEventListener('input', search);
    inp.addEventListener('keydown', e=>{ if(e.key==='Enter'){ e.preventDefault(); const b=res.querySelector('button'); if(b) b.click(); } });
    form.addEventListener('click', e=>{
      const rm=e.target.closest('[data-prm]'); if(rm){ sel.splice(+rm.dataset.prm,1); draw(); search(); return; }
      const ad=e.target.closest('[data-padd]'); if(ad){ const p=pool().find(x=>x.key===ad.dataset.padd); if(p&&!has(p.key)) sel.push({nama:p.nama,kelas:p.kelas}); inp.value=''; draw(); search(); inp.focus(); return; }
      const cl=e.target.closest('[data-pcls]'); if(cl){ pool().filter(p=>p.kelas===cl.dataset.pcls && !has(p.key)).forEach(p=>sel.push({nama:p.nama,kelas:p.kelas})); inp.value=''; draw(); search(); return; }
      if(e.target.closest('[data-pfree]')){ sel.push({nama:normNama(inp.value),kelas:''}); inp.value=''; draw(); search(); return; }
      if(e.target.closest('[data-pxl]')){ pickFile(items=>{
        const ps=pool(); let linked=0, loose=0;
        items.forEach(it=>{ let f=ps.find(p=>p.key===pkey(it));
          if(!f){ const same=ps.filter(p=>p.nama.toUpperCase()===it.nama.toUpperCase()); if(same.length===1) f=same[0]; }
          const x = f?{nama:f.nama,kelas:f.kelas}:{nama:it.nama,kelas:it.kelas};
          if(!has(pkey(x))){ sel.push(x); f?linked++:loose++; } });
        draw(); toast(`${linked} murid dipadankan${loose?`, ${loose} tiada dalam Senarai Murid`:''}`);
      }); }
    });
  }
  return { get:()=>sel.slice() };
}

const IMG_OK = ['image/jpeg','image/png','image/webp','image/gif'];
function lampHtml(ed){
  const canUp = ed && !!state.assets;
  return `<div class="section-label">Gambar & dokumen <span class="sub" id="lcount"></span></div>

  <p class="hint" style="margin:0">Gambar, OPR atau sijil dalam bentuk JPG, PNG atau PDF (maks 20 MB). Fail Word/PowerPoint perlu disimpan sebagai PDF dahulu. Gambar besar dikecilkan secara automatik.</p>`
  : ed ? `<p class="hint" style="margin:0">Akaun anda belum dibenarkan memuat naik fail. Minta pemilik hab memberi akses Editor.</p>` : ''}`;
}
function galItem(it, removable){
  const isImg = String(it.type||'').startsWith('image/');
  return `<div class="gitem">${isImg?`<a href="/_blob/${esc(it.id)}" target="_blank" rel="noopener"><img src="/_blob/${esc(it.id)}" alt="${esc(it.name)}" loading="lazy"></a>`:`<a href="/_blob/${esc(it.id)}" target="_blank" rel="noopener"><div class="doc">${svg('pdf')}<span>${esc(it.name)}</span></div></a>`}${removable?`<button type="button" class="x" data-lrm="${esc(it.id)}" aria-label="Buang ${esc(it.name)}">${svg('close')}</button>`:''}</div>`;
}
function fixBrokenImgs(root){ root.querySelectorAll('.gitem img').forEach(img=>img.addEventListener('error',()=>{ const d=document.createElement('div'); d.className='doc'; d.innerHTML=svg('photo')+'<span>Gambar tidak dapat dipaparkan</span>'; img.replaceWith(d); },{once:true})); }
function galleryHtml(list){ return (list&&list.length) ? `<div class="gallery">${list.map(it=>galItem(it,false)).join('')}</div>` : ''; }
async function shrink(file){
  if(file.type==='application/pdf') return {blob:file, type:'application/pdf'};
  const isImg = file.type.startsWith('image/') || /\.(heic|heif|jpe?g|png|webp|gif)$/i.test(file.name);
  if(!isImg) throw {code:'unsupported_type'};
  if(file.type==='image/gif') return {blob:file, type:'image/gif'};
  try{
    if(IMG_OK.includes(file.type) && file.size<900000) return {blob:file, type:file.type};
    const bmp = await createImageBitmap(file);
    const sc = Math.min(1, 1800/Math.max(bmp.width,bmp.height));
    const c = document.createElement('canvas'); c.width=Math.round(bmp.width*sc); c.height=Math.round(bmp.height*sc);
    c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);
    const blob = await new Promise(r=>c.toBlob(r,'image/jpeg',0.82));
    if(!blob) throw 0;
    return {blob, type:'image/jpeg'};
  }catch(e){ if(IMG_OK.includes(file.type)) return {blob:file,type:file.type}; throw {code:'unsupported_type'}; }
}
function assetErr(e){
  const c = e&&e.code;
  return c==='too_large'?(IS_SA?'Fail melebihi 4 MB. Kecilkan atau pecahkan fail dahulu.':'Fail melebihi 20 MB.') : c==='unsupported_type'?'Jenis fail tidak disokong. Gunakan JPG, PNG atau PDF.' : c==='quota_or_state'?'Ruang storan fail penuh.' : c==='not_granted'?'Akaun anda tidak dibenarkan memuat naik.' : c==='rate_limited'?'Terlalu banyak muat naik. Cuba sebentar lagi.' : 'Muat naik gagal. Cuba lagi.';
}
function initLampiran(form, initial, ed){
  let list = (initial||[]).map(x=>({...x}));
  const fresh = new Set(), removed=[]; let pending=0;
  const gal=form.querySelector('#gal'), lc=form.querySelector('#lcount'), inp=form.querySelector('#lfile');
  const draw=()=>{
    gal.innerHTML = list.map(it=>galItem(it, ed)).join('') + Array.from({length:pending},()=>`<div class="gitem busy">Memuat naik…</div>`).join('');
    lc.textContent = list.length ? list.length+' fail' : (ed?'':'Tiada fail');
    fixBrokenImgs(gal);
  };
  draw();
  if(inp) inp.addEventListener('change', async ()=>{
    const files=[...inp.files]; inp.value='';
    for(const f of files){
      pending++; draw();
      try{ const {blob,type}=await shrink(f); const r=await state.assets.upload(blob,{type});
        list.push({id:r.id, name:f.name.replace(/\.(heic|heif)$/i,'.jpg'), type:r.contentType, size:r.sizeBytes}); fresh.add(r.id); }
      catch(e){ toast(`${f.name}: ${assetErr(e)}`); }
      pending--; draw();
    }
  });
  gal.addEventListener('click', e=>{
    const x=e.target.closest('[data-lrm]'); if(!x) return; e.preventDefault();
    const id=x.dataset.lrm; list=list.filter(i=>i.id!==id);
    if(fresh.has(id)){ fresh.delete(id); if(state.assets) state.assets.delete(id).catch(()=>{}); } else removed.push(id);
    draw();
  });
  return {
    get:()=>list.slice(), pending:()=>pending>0,
    commit:()=>{ if(state.assets) removed.forEach(id=>state.assets.delete(id).catch(()=>{})); fresh.clear(); },
    cleanup:()=>{ if(state.assets) fresh.forEach(id=>state.assets.delete(id).catch(()=>{})); fresh.clear(); }
  };
}

async function blobToJpeg(id){
  const resp = await fetch('/_blob/'+id); if(!resp.ok) throw new Error('fetch');
  const bmp = await createImageBitmap(await resp.blob());
  const sc = Math.min(1, 1600/Math.max(bmp.width,bmp.height));
  const c=document.createElement('canvas'); c.width=Math.round(bmp.width*sc); c.height=Math.round(bmp.height*sc);
  const x=c.getContext('2d'); x.fillStyle='#fff'; x.fillRect(0,0,c.width,c.height); x.drawImage(bmp,0,0,c.width,c.height);
  return {data:c.toDataURL('image/jpeg',0.82), w:c.width, h:c.height};
}

  s.fields.forEach(f=>{
    let v=r[f.k];
    if(f.type==='unit') v=r.unitNama||'';
    if(f.type==='gurus') v=(r.guruList&&r.guruList.length)?r.guruList.join(', '):(r.guru||'');
    if(v==null||v==='') return;

}

function allGuruNames(Y){

function initGuruPicker(form, initial, ed){
  const chips=form.querySelector('#gchips'); if(!chips) return null;
  let sel=(initial||[]).filter(Boolean).slice();
  const inp=form.querySelector('#gpick'), res=form.querySelector('#gresults');
  const yr=()=>+((form.querySelector('#f_tahun')||{}).value)||classYear();
  const same=(a,b)=>guruKey(a)===guruKey(b);
  const draw=()=>{ chips.innerHTML = sel.length ? sel.map((n,i)=>`<span class="pchip">${esc(n)}${ed?`<button type="button" data-grm="${i}" aria-label="Buang ${esc(n)}">${svg('close').replace('<svg','<svg width="12" height="12"')}</button>`:''}</span>`).join('') : '<span class="muted">Belum ada guru dipilih.</span>'; };
  const search=()=>{ if(!res) return; const q=inp.value.trim().toLowerCase(); const all=allGuruNames(yr());
    const names=all.filter(n=>!sel.some(x=>same(x,n)) && (!q || n.toLowerCase().includes(q)));
    let h=names.slice(0,q?12:80).map(n=>`<button type="button" data-gadd="${esc(n)}"><span>${esc(n)}</span></button>`).join('');
    if(q.length>=3 && !all.some(n=>same(n,q))) h+=`<button type="button" data-gfree><span>Tambah “${esc(inp.value.trim())}”</span><span class="k">tiada dalam senarai guru</span></button>`;
    res.innerHTML = h || '<p class="hint" style="margin:0">Tiada guru sepadan.</p>'; res.hidden=false; };
  draw();
  if(ed && inp){
    inp.addEventListener('focus',search); inp.addEventListener('input',search);
    inp.addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); const b=res.querySelector('button'); if(b) b.click(); } if(e.key==='Escape'){ res.hidden=true; } });
    form.addEventListener('click',e=>{
      const rm=e.target.closest('[data-grm]'); if(rm){ sel.splice(+rm.dataset.grm,1); draw(); search(); return; }
      const ad=e.target.closest('[data-gadd]'); if(ad){ sel.push(ad.dataset.gadd); inp.value=''; draw(); search(); inp.focus(); return; }
      if(e.target.closest('[data-gfree]')){ sel.push(normNama(inp.value)); inp.value=''; draw(); search(); return; }
      if(!e.target.closest('#gresults') && e.target!==inp) res.hidden=true;
    });
  }
  return {get:()=>sel.slice()};
}

function rumahHue(r){ const t=((r&&r.warna)||'')+' '+((r&&r.nama)||''); const l=t.toLowerCase(); return l.includes('merah')?'#e5484d':l.includes('biru')?'#3b82f6':l.includes('hijau')?'#22a06b':l.includes('kuning')?'#e3a800':l.includes('ungu')?'#8b5cf6':(l.includes('jingga')||l.includes('oren'))?'#f97316':'#64748b'; }

  const rs = olRumah(); const T = {}; rs.forEach(r=>T[r.id]={r, pts:0, e:0, p:0, g:0, kat:{}, jenis:{}});

  let y,m,d;
  if(xNum(v) && v>30000 && v<80000){ const t=new Date(Date.UTC(1899,11,30)+Math.round(v)*86400000); y=t.getUTCFullYear(); m=t.getUTCMonth()+1; d=t.getUTCDate(); }

  if(y<2000 && yearHint) y=yearHint;
  const ok=(Y,M,D)=>{ const t=new Date(Date.UTC(Y,M-1,D)); return t.getUTCMonth()===M-1 && t.getUTCDate()===D ? t : null; };
  const out=[]; const a=ok(y,m,d); if(a) out.push(a); if(m!==d){ const b=ok(y,d,m); if(b) out.push(b); }

function xResolver(allCands){
  const cnt=new Array(7).fill(0); const single=allCands.filter(c=>c.length===1); (single.length?single:allCands.filter(c=>c.length)).forEach(c=>cnt[c[0].getUTCDay()]++);
  const mode=cnt.indexOf(Math.max(...cnt)); const lim=Date.now()+400*86400000;
  return (cands, prev) => { if(!cands.length) return ''; const iso=c=>c.toISOString().slice(0,10);
    const good=cands.filter(c=>c.getUTCDay()===mode && c.getTime()<=lim); const pool=good.length?good:cands.filter(c=>c.getTime()<=lim);
    const after = prev ? pool.find(c=>iso(c)>=prev) : null; const p = after || pool[0] || cands[0]; return iso(p); };
}
