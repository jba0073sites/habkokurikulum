function parseUnitBook(wb, fname){
  const Y=xYear(fname,wb); const out={tahun:Y, teachers:[], posts:[], members:[], takwim:[], att:{}, reports:[], title:''};
  const allC=[];
  // carta
  let mode=null, lab='';
  for(const r of xRows(xSheet(wb,'NAMA GURU')||{})){ const c=(r||[]).map(XS); const up=(c[0]||'').toUpperCase();
    if(up.includes('SUKAN/PERMAINAN')||up.includes('UNIT BERUNIFORM')){ out.title=c[1]||''; continue; }
    if(up.startsWith('SENARAI NAMA GURU')){ mode='g'; lab=''; continue; }
    if(up.startsWith('MAKLUMAT CARTA')){ mode='p'; lab=''; continue; }
    if(mode==='g'){ if(c[0]) lab=c[0].replace(/:$/,''); if(c[1] && !xNum(r[1])) out.teachers.push({lab, nama:xTitle(c[1])}); }
    else if(mode==='p'){ if((c[1]||'').toUpperCase()==='NAMA') continue; if(c[0]) lab=c[0].replace(/:$/,''); if(c[1] && c[1].length>3) out.posts.push({lab, nama:c[1], kelas:c[2]||''}); } }
  // ahli
  const ar=xRows(xSheet(wb,'SENARAI NAMA')||{}); const ah=xHeader(ar,['NAMA']);
  if(ah){ const ni=xCol(ah.cols,'NAMA'), ki=xCol(ah.cols,'KELAS'); const seen=new Set();
    ar.slice(ah.i+1).forEach(r=>{ const n=normNama(XS((r||[])[ni])).toUpperCase(); if(n.length<4||n.startsWith('JUMLAH')) return; const k=normKelas(ki>=0?XS(r[ki]):''); const key=n+'|'+k; if(seen.has(key)) return; seen.add(key); out.members.push({nama:n, kelas:k}); }); }
  // takwim
  const tkC=[]; for(const r of xRows(xSheet(wb,'TAKWIM')||{})){ if(r && xNum(r[0]) && XS(r[1])){ const cs=xDateCands(r[2],Y); allC.push(cs); tkC.push({bil:Math.round(r[0]), aktiviti:XS(r[1]).replace(/\s*\n\s*/g,'; '), cs, raw:XS(r[2])}); } }
  // kehadiran
  const kr=xRows(xSheet(wb,'KEHADIRAN')||{}); const kh=xHeader(kr,['NAMA']); const attCols=[];
  if(kh){ const ni=xCol(kh.cols,'NAMA'); (kr[kh.i]||[]).forEach((v,j)=>{ const cs=xDateCands(v,Y); if(cs.length){ allC.push(cs); attCols.push({j,cs}); } });
    out._attRows = kr.slice(kh.i+1).map(r=>({nama:normNama(XS((r||[])[ni])).toUpperCase(), r:r||[]})).filter(x=>x.nama.length>3); }
  // laporan
  const repRaw=[]; wb.SheetNames.filter(n=>/^\s*laporan\s*\d+/i.test(n)).forEach(n=>{ const rp=parseLaporanSheet(xRows(wb.Sheets[n])); rp.n=+n.match(/\d+/)[0]; if(rp.tarikhRaw!=null){ rp.cs=xDateCands(rp.tarikhRaw,Y); allC.push(rp.cs); } else rp.cs=[]; if(rp.cs.length||rp.tajuk||rp.keg.length) repRaw.push(rp); });
  const pick=xResolver(allC);
  let prevT=''; out.takwim=tkC.map((t,i)=>{ const d=pick(t.cs,prevT); if(d) prevT=d; return {id:'t'+String(i+1).padStart(2,'0'), bil:t.bil, tarikh:d, aktiviti:t.aktiviti, catatan:t.cs.length?'':t.raw}; });
  attCols.forEach(c=>c.d=pick(c.cs));
  (out._attRows||[]).forEach(x=>attCols.forEach(c=>{ const v=x.r[c.j]; if(v==null||XS(v)==='') return; const h = v===true || /^(HADIR|\/|√|✓|1|H)$/i.test(XS(v)); (out.att[c.d]=out.att[c.d]||{})[x.nama]=h; }));
  delete out._attRows;
  repRaw.sort((a,b)=>a.n-b.n); let prevR=''; out.reports=repRaw.map(rp=>{ const d=rp.cs.length?pick(rp.cs,prevR):((out.takwim[rp.n-1]||{}).tarikh||''); if(d) prevR=d; return {...rp, tarikh:d}; });
  return out;
}
function parseLaporanSheet(R){
  const rep={tajuk:'',masa:'',tempat:'',gurus:[],keg:[],sisipan:[],masalah:[],ulasan:[],disediakan:''}; let sec=null;
  for(const r of R){ if(!r) continue; const c0=XS(r[0]); const up=c0.toUpperCase();
    if(up.startsWith('NAMA AKTIVITI')){ rep.tajuk=XS(r.slice(1).find(x=>XS(x))||''); continue; }
    if(up==='TARIKH'){ rep.tarikhRaw=r.slice(1,3).find(x=>x!=null&&XS(x)!==''); rep.jumlahN=r.slice(3).find(xNum); continue; }
    if(up==='MASA'){ rep.masa=XS(r.slice(1,3).find(x=>XS(x))||''); rep.hadirN=r.slice(3).find(xNum); continue; }
    if(up==='TEMPAT'){ rep.tempat=XS(r.slice(1,3).find(x=>XS(x))||''); continue; }
    if(up.startsWith('GURU-GURU')){ sec='g'; continue; }
    if(up.startsWith('KEHADIRAN MURID')){ sec=null; continue; }
    if(up.startsWith('LAPORAN KEGIATAN')){ sec='k'; continue; }
    if(up==='SISIPAN'){ sec='s'; continue; } if(up.startsWith('MASALAH')){ sec='m'; continue; } if(up.startsWith('ULASAN GURU')){ sec='u'; continue; } if(up.startsWith('DISEDIAKAN')){ sec='d'; continue; }
    if(sec==='g'){ if(/^\d\./.test(c0) && !xNum(r[0])){ sec='k'; rep.keg.push(c0); continue; } const names=r.filter(x=>typeof x==='string'&&XS(x)); const bools=r.filter(x=>typeof x==='boolean'); names.forEach((n,i)=>{ if(bools[i]) rep.gurus.push(XS(n)); }); continue; }
    if(!c0) continue;
    if(sec==='k') rep.keg.push(c0);
    else if(sec==='s'){ const i=r.findIndex(x=>XS(x).toUpperCase()==='TAJUK'); const tj=i>=0?XS(r.slice(i+1).find(x=>XS(x))||''):''; if(tj) rep.sisipan.push(c0.replace(/^\d\.\s*/,'').replace(/^SIVIK/i,'Sivik').replace(/^PIKEBM/i,'PIKeBM')+': '+tj); }
    else if(sec==='m') rep.masalah.push(c0); else if(sec==='u') rep.ulasan.push(c0); else if(sec==='d' && !rep.disediakan) rep.disediakan=c0; }
  return rep;
}
function parseRumahBook(wb, fname){
  const Y=xYear(fname,wb); const rumah=[];
  wb.SheetNames.forEach(sn=>{ const rows=xRows(wb.Sheets[sn]); const h=xHeader(rows,['NAMA','KELAS']); if(!h) return;
    const title=(rows.slice(0,h.i).flat().map(XS).find(x=>/RUMAH/i.test(x))||sn);
    const wm=String(sn+' '+title).toUpperCase().match(/MERAH|BIRU|HIJAU|KUNING|UNGU|JINGGA|OREN|PUTIH|HITAM|EMAS|PERAK/); const warna=xTitle(wm?wm[0]:sn.replace(/\b20\d\d\b/,'').replace(/RUMAH/i,'').trim()||sn);
    const ni=xCol(h.cols,'NAMA'), ki=xCol(h.cols,'KELAS'); let ji=xCol(h.cols,'JANTINA');
    const list=[]; const seen=new Set();
    rows.slice(h.i+1).forEach(r=>{ r=r||[]; const n=normNama(XS(r[ni])).toUpperCase(); const k=normKelas(XS(r[ki])); if(n.length<4||!k) return; const key=n+'|'+k; if(seen.has(key)) return; seen.add(key);
      let j=ji>=0?XS(r[ji]).toUpperCase():XS(r[ni+1]).toUpperCase(); j=(j==='L'||j==='P')?j:''; list.push({nama:n,kelas:k,jantina:j}); });
    if(list.length) rumah.push({nama:'Rumah '+warna, warna, list}); });
  return {tahun:Y, rumah};
}
function parseListBook(wb, fname){ const rows=xRows(wb.Sheets[wb.SheetNames[0]]); const p=parseRows(rows.map(r=>(r||[]).map(XS))); return {tahun:xYear(fname,wb), items:p.items||[], title:String(fname).replace(/\.[^.]+$/,'').replace(/^[0-9a-f]{8}-/,'').replace(/^\d{4}[_ .-]*\d*[._ ]*/,'').replace(/_/g,' ').trim()}; }
function parseCapaiBook(wb, fname){
  const rows=xRows(wb.Sheets[wb.SheetNames[0]]); const h=xHeader(rows,['PERTANDINGAN']); const c=h.cols; const Y=xYear(fname,wb);
  const ix={t:xCol(c,'TARIKH'),p:xCol(c,'PERTANDINGAN'),l:xCol(c,'PERINGKAT'),b:xCol(c,'BIDANG'),u:xCol(c,'UNIT'),j:xCol(c,'JENIS'),k:xCol(c,'KEPUTUSAN','PENCAPAIAN'),n:xCol(c,'NAMA MURID','NAMA'),kl:xCol(c,'KELAS'),g:xCol(c,'GURU')};
  const allC=[]; const raw=rows.slice(h.i+1).map(r=>r||[]).filter(r=>XS(r[ix.p])); raw.forEach(r=>{ r._c=ix.t>=0?xDateCands(r[ix.t],Y):[]; allC.push(r._c); }); const pick=xResolver(allC);
  const G=new Map();
  raw.forEach(r=>{ const tarikh=pick(r._c); const key=[tarikh,XS(r[ix.p]),XS(r[ix.k])].join('|'); if(!G.has(key)) G.set(key,{tarikh, tahun:tarikh?+tarikh.slice(0,4):Y, pertandingan:XS(r[ix.p]), peringkat:XS(r[ix.l]), bidang:XS(r[ix.b]), unit:XS(r[ix.u]), jenis:XS(r[ix.j]), keputusan:XS(r[ix.k]), peserta:[], guru:new Set()});
    const g=G.get(key); const n=normNama(XS(r[ix.n])).toUpperCase(); if(n) g.peserta.push({nama:n, kelas:normKelas(XS(r[ix.kl]))}); XS(r[ix.g]).split(/\s*[;,]\s*/).filter(Boolean).forEach(x=>g.guru.add(xTitle(x))); });
  return {tahun:Y, items:[...G.values()].map(g=>({...g, guru:[...g.guru]}))};
}
function parseOlBook(wb){
  const rows=xRows(wb.Sheets[wb.SheetNames[0]]); const h=xHeader(rows,['TEMPAT','RUMAH']); const c=h.cols;
  const ix={no:xCol(c,'NO'),a:xCol(c,'ACARA'),k:xCol(c,'KATEGORI'),t:xCol(c,'TEMPAT'),r:xCol(c,'RUMAH'),n:xCol(c,'NAMA','PESERTA'),kl:xCol(c,'KELAS'),m:xCol(c,'MASA','CATATAN')};
  const items=[]; rows.slice(h.i+1).forEach(r=>{ r=r||[]; const t=+XS(r[ix.t]); const rm=XS(r[ix.r]); if(!t||!rm) return;
    const names=XS(r[ix.n]).split(/\s*;\s*/).filter(Boolean).map(v=>{ const mm=v.match(/^(.*?)\s*\((.*)\)\s*$/); return mm?{nama:normNama(mm[1]).toUpperCase(),kelas:normKelas(mm[2])}:{nama:normNama(v).toUpperCase(),kelas:normKelas(ix.kl>=0?XS(r[ix.kl]):'')}; });
    items.push({no:+XS(r[ix.no])||null, acara:XS(r[ix.a]), kategori:XS(r[ix.k]), tempat:t, rumah:rm, peserta:names, catatan:XS(r[ix.m])}); });
  return {items};

function detectBook(wb, fname){
  const N=wb.SheetNames.map(s=>s.trim().toUpperCase());
  if(N.some(s=>s==='_DATA')) return 'sandaran';
  if(N.some(s=>s.startsWith('SENARAI NAMA')) && N.some(s=>s.startsWith('NAMA GURU'))) return 'unit';
  const first=xRows(wb.Sheets[wb.SheetNames[0]]);
  if(xHeader(first,['PERTANDINGAN'])) return 'pencapaian';
  if(xHeader(first,['TEMPAT','RUMAH']) && xHeader(first,['ACARA'])) return 'olahraga';
  const rumahy=/RUMAH/i.test(fname) || N.filter(s=>/MERAH|BIRU|HIJAU|KUNING/.test(s)).length>=2;
  if(rumahy && wb.SheetNames.some(s=>xHeader(xRows(wb.Sheets[s]),['NAMA','KELAS']))) return 'rumah';
  if(xHeader(first,['NAMA'])) return 'senarai';
  return 'tidak';
}

      if(type==='tidak'){ state.imp.push({key:uid(), fname:f.name, type:'ai', file:f, kind:smartGuess(f.name, XLSX.utils.sheet_to_csv(wb.Sheets[wb.SheetNames[0]])), on:false}); continue; } const it={key:uid(), fname:f.name, type, on:type!=='tidak'&&type!=='sandaran'};
      if(type==='unit'){ it.data=parseUnitBook(wb,f.name); const t=it.data.title||f.name; it.sec=guessSec(t+' '+f.name); it.nama=xTitle(t.replace(/^PERMAINAN\s+/i,'')); it.tahun=it.data.tahun; }

}

function canonGuru(Y){ const names=allGuruNames(Y); return n=>{ const k=guruKey(n); const ex=names.find(x=>guruKey(x)===k); if(ex) return ex; let best=null,bs=0; names.forEach(x=>{ const s=xDice(guruKey(x),k); if(s>bs){bs=s;best=x;} }); return bs>=0.88?best:n; }; }
async function mergeMembers(unitId, meta, items){

async function ensureUnit(it, extra){

const LOG_COL={records:'Rekod',members:'Senarai ahli',reports:'Laporan perjumpaan',olahraga:'Tetapan olahraga',olahraga_acara:'Acara olahraga',olahraga_daftar:'Pendaftaran atlet',pajsk:'PAJSK',config:'Tetapan hab'};
const LOG_ACT={set:'Simpan',update:'Kemas kini',delete:'Padam',add:'Tambah'};
let logBuf=[], logTimer=null;
function logSummary(col, id, d){
  const r = col==='records' ? (state.records.find(x=>x.id===id)||{}) : {};
  const src={...r, ...(d&&typeof d==='object'?d:{})};
  if(col==='records'){ const S=SEC[src.sec]; return `${S?S.name+': ':''}${src.nama||src.pertandingan||src.tajuk||src.mesyuarat||src.unit||id}`; }
  if(col==='members'){ const m=state.members[id]||{}; return `${src.nama||m.nama||id}${d&&d.list?` (${d.list.length} nama)`:''}`; }
  if(col==='reports'){ return `${(state.records.find(x=>x.id===src.unitId)||{}).nama||''} Bil. ${src.bil||''} ${src.tajuk||''}`.trim(); }
  if(col==='olahraga_acara'){ const a=(state.olAcara||[]).find(x=>x.id===id)||{}; return `${src.no||a.no||''} ${src.nama||a.nama||''}`.trim(); }
  if(col==='pajsk') return src.nama||id;
  return id;
}
function logChange(act, col, id, d){
  if(col==='log' || !state.rawDb) return;
  logBuf.push({t:new Date().toISOString(), u:state.uid||'', a:act, c:col, id:String(id||''), s:String(logSummary(col,id,d)).slice(0,140)});
  clearTimeout(logTimer); logTimer=setTimeout(flushLog, 1500);
}
async function flushLog(){
  if(!logBuf.length || !state.rawDb) return; const items=logBuf.splice(0); const day=items[0].t.slice(0,10);
  // ringkaskan operasi pukal: gabung entri sama (tindakan+koleksi) yang berturut
  const merged=[]; items.forEach(e=>{ const l=merged[merged.length-1]; if(l && l.a===e.a && l.c===e.c && l.u===e.u && (l.n||1)>=1 && e.c!=='records'){ l.n=(l.n||1)+1; l.s=`${l.n} ${LOG_COL[e.c]||e.c}`; } else merged.push({...e}); });
  try{ const ref=state.rawDb.collection('log').doc('d-'+day); const snap=await ref.get(); const cur=snap.exists?(snap.data().entries||[]):[];
    await ref.set({hari:day, entries:cur.concat(merged).slice(-500), updatedAt:new Date().toISOString()}); }catch(e){ /* sejarah tidak kritikal */ }
}
function wrapDb(db){
  // Plain delegating objects (no Proxy): the platform db namespace is frozen.
  const call=(o,m,a)=>{ if(typeof o[m]!=='function') throw new Error('db.'+m+' tiada'); return o[m](...a); };
  const wrapRef=(ref,col,id)=>{
    const w={ id:ref.id!==undefined?ref.id:id, path:ref.path!==undefined?ref.path:(col+'/'+id), raw:ref,
      get:(...a)=>call(ref,'get',a),

/* ===== Combo: senarai pilihan yang sentiasa tunjuk semua pilihan (ganti datalist pelayar) ===== */
(function(){
  let pop=null, cur=null, all=[], showAll=true, hi=-1, shown=[];
  const MAXN=200;
  function readOpts(inp){ const dl=document.getElementById(inp.dataset.combo); if(!dl) return []; return [...dl.querySelectorAll('option')].map(o=>({v:o.value, l:(o.label&&o.label!==o.value)?o.label:''})); }

  function scan(root){ if(!root||!root.querySelectorAll) return; if(root.matches&&root.matches('input[list]')) convert(root); root.querySelectorAll('input[list]').forEach(convert); }
  new MutationObserver(ms=>ms.forEach(m=>m.addedNodes.forEach(n=>scan(n)))).observe(document.documentElement,{childList:true,subtree:true});
  document.addEventListener('DOMContentLoaded',()=>scan(document.body));
  function close(){ if(pop){ pop.remove(); pop=null; } cur=null; hi=-1; }
  function place(){ if(!pop||!cur) return; const r=cur.getBoundingClientRect(); if(!r.width){ close(); return; } const below=window.innerHeight-r.bottom, h=Math.min(300, pop.scrollHeight||300);
    pop.style.left=Math.max(8,Math.min(r.left, window.innerWidth-Math.max(r.width,220)-8))+'px'; pop.style.width=Math.max(r.width,220)+'px';
    if(below<h+12 && r.top>below){ pop.style.top=''; pop.style.bottom=(window.innerHeight-r.top+4)+'px'; } else { pop.style.bottom=''; pop.style.top=(r.bottom+4)+'px'; } }
  function draw(){ if(!pop||!cur) return; const q=showAll?'':cur.value.trim().toLowerCase();
    shown=all.filter(o=>!q||o.v.toLowerCase().includes(q)||o.l.toLowerCase().includes(q));
    if(q){ shown.sort((a,b)=>(a.v.toLowerCase().startsWith(q)?0:1)-(b.v.toLowerCase().startsWith(q)?0:1)); }
    const more=shown.length>MAXN; shown=shown.slice(0,MAXN);
    if(!shown.length){ pop.innerHTML=`<div class="cmempty">${all.length?'Tiada pilihan sepadan. Teks yang ditaip akan disimpan.':'Tiada pilihan.'}</div>`; place(); return; }
    const val=cur.value.trim();
    pop.innerHTML=shown.map((o,i)=>`<button type="button" tabindex="-1" data-ci="${i}" class="${i===hi?'hi ':''}${o.v===val?'on':''}"><span>${esc(o.v)}</span>${o.l?`<small>${esc(o.l)}</small>`:''}</button>`).join('')+(more?`<div class="cmempty">Taip untuk menapis lebih banyak pilihan…</div>`:'');
    place(); }
  function open(inp){ if(cur===inp && pop) return; close(); if(inp.disabled||inp.readOnly) return; cur=inp; all=readOpts(inp); showAll=true; hi=-1;
    pop=document.createElement('div'); pop.className='combo'; pop.setAttribute('role','listbox'); document.body.appendChild(pop);
    pop.addEventListener('mousedown',e=>e.preventDefault());
    pop.addEventListener('click',e=>{ const b=e.target.closest('[data-ci]'); if(b) pick(shown[+b.dataset.ci]); });
    draw(); }
  function pick(o){ if(!o||!cur) return; const inp=cur; inp.value=o.v; close(); inp.dispatchEvent(new Event('input',{bubbles:true})); inp.dispatchEvent(new Event('change',{bubbles:true})); }
  document.addEventListener('focusin',e=>{ const t=e.target; if(t&&t.matches&&t.matches('input[data-combo]')) open(t); else if(pop&&!(pop.contains(t))) close(); });
  document.addEventListener('mousedown',e=>{ const t=e.target; if(t&&t.matches&&t.matches('input[data-combo]')){ if(cur===t&&pop){ showAll=true; draw(); } else open(t); return; } if(pop&&!pop.contains(t)) close(); });
  document.addEventListener('input',e=>{ if(e.target===cur && e.isTrusted!==false){ showAll=false; hi=-1; draw(); } });
  document.addEventListener('keydown',e=>{ if(!cur||e.target!==cur) return; if(!pop){ if(e.key==='ArrowDown'){ open(cur); e.preventDefault(); } return; }
    if(e.key==='ArrowDown'){ hi=Math.min(shown.length-1,hi+1); draw(); e.preventDefault(); }
    else if(e.key==='ArrowUp'){ hi=Math.max(0,hi-1); draw(); e.preventDefault(); }
    else if(e.key==='Enter' && hi>=0){ pick(shown[hi]); e.preventDefault(); e.stopPropagation(); }
    else if(e.key==='Escape'){ close(); e.stopPropagation(); }
    else if(e.key==='Tab') close(); }, true);
  document.addEventListener('focusout',e=>{ if(e.target===cur) setTimeout(()=>{ if(cur&&document.activeElement!==cur) close(); },120); });
  window.addEventListener('scroll',()=>place(),true); window.addEventListener('resize',()=>place());
})();

async function smartExtract(spec, files, Y, say, signal, forceAI){

  for(const f of files){ say(`Membaca ${f.name}…`); const rd=await smartRead(f, say); if(rd.note) notes.push(rd.note);
    let got=null;
    if(!forceAI){ got=smartFromTables(spec, rd.tables, Y) || (rd.pdfLines&&smartClean(spec, pdfColTable(spec, rd.pdfLines)||[], Y)) || null; if(got&&!got.length) got=null; if(!got) got=smartHeuristic(spec, rd.lines, Y); }

}

function smartGuess(fname, text){ const s=(fname+' '+(text||'').slice(0,3000)).toLowerCase();
  if(/takwim|perancangan tahunan|jadual perjumpaan/.test(s)) return /kelab|unit|persatuan|pengakap|puteri|tunas|bulan sabit/.test(fname.toLowerCase())?'takwim':'aktiviti';
  if(/minit|mesyuarat/.test(s)) return 'mesyuarat'; if(/pencapaian|johan|naib johan|keputusan pertandingan/.test(s)) return 'pencapaian';
  if(/acara|100m|lompat jauh|olahraga/.test(s)) return 'olacara'; if(/guru|jawatankuasa/.test(s)) return 'guru'; if(/nama murid|senarai ahli|kelas/.test(s)) return 'ahli'; return 'aktiviti'; }

function deleteUnit(r){ if(!state.isAdmin){ toast('Hanya Editor boleh memadam unit.'); return; }
  const reps=reportsOf(r.id); const mem=memberList(r.id); const Y=+r.tahun; const nm=String(r.nama).trim().toLowerCase();
  const roles=state.records.filter(x=>x.sec==='jawatankuasa'&&+x.tahun===Y&&String(x.unit||'').trim().toLowerCase()===nm);
  const caps=state.records.filter(x=>x.unitId===r.id);

    body:`<p style="margin:0 0 10px">Unit ini akan dipadam untuk semua pengguna, bersama:</p>

      <div class="field"><label for="du_c">Untuk mengesahkan, taip <b>PADAM</b></label><input id="du_c" autocomplete="off" placeholder="PADAM"></div><p class="sub" id="du_p" style="margin:6px 0 0"></p>`,
    foot:`<span class="sp"></span><button type="button" class="btn btn-ghost" data-close>Batal</button><button type="submit" class="btn btn-danger" disabled>Padam unit</button>`});
  const btn=form.querySelector('[type=submit]'); form.querySelector('#du_c').addEventListener('input',e=>btn.disabled=e.target.value.trim().toUpperCase()!=='PADAM');
  form.addEventListener('submit',async e=>{ e.preventDefault(); if(btn.disabled) return; btn.disabled=true; const p=form.querySelector('#du_p'); const say=t=>p.textContent=t;
    try{ let n=0; for(const x of reps){ await state.db.collection('reports').doc(x.id).delete(); say(`Memadam laporan ${++n}/${reps.length}…`); }
      for(const x of roles){ if(x.jawatan) await state.db.collection('records').doc(x.id).update({unit:'', tugas:''}); else await state.db.collection('records').doc(x.id).delete(); }
      for(const x of caps) await state.db.collection('records').doc(x.id).update({unitId:'', unitNama:''});
      if(state.members[r.id]) await state.db.collection('members').doc(r.id).delete().catch(()=>{});
      await state.db.collection('records').doc(r.id).delete();
      if(state.assets) (r.surat||[]).forEach(a=>state.assets.delete(a.id).catch(()=>{}));
      closeForm(); toast(`${r.nama} dipadam`); location.hash=r.sec; }
    catch(err){ btn.disabled=false; ferr(writeErr(err)); } });
}

/* ===== PAJSK merentas tahun (GPA → CGPA, Jadual 18–19) ===== */
const pjNameKey=n=>normNama(n).toUpperCase().replace(/[^A-Z0-9]/g,'');
function subscribePjRek(){ if(!state.db||state.unsubPR) return; state.unsubPR=state.db.collection('pajsk_rekod').orderBy('tahun','desc').limit(1000).onSnapshot(s=>{ state.pjRek=s.docs.map(d=>({id:d.id,...d.data()})); render(); },()=>{}); }
function pjHistory(p, Y){ const D=effDarjah(p); const k=pjNameKey(p.nama); const L=(state.pjRek||[]).filter(x=>x.nk===k && +x.tahun<Y && +x.darjah>=4 && +x.darjah<D && (+x.darjah - D)===(+x.tahun - Y));
  const by=new Map(); L.forEach(x=>{ const o=by.get(x.darjah); if(!o||String(x.updatedAt||'')>String(o.updatedAt||'')) by.set(x.darjah,x); }); return [...by.values()].sort((a,b)=>a.darjah-b.darjah); }
function pjCgpa(p, r, Y){ const H=pjHistory(p, Y); const chain=[...H.map(x=>({darjah:+x.darjah, tahun:+x.tahun, gpa:+x.gpa, src:x.sumber})), {darjah:effDarjah(p), tahun:Y, gpa:r.tl?null:r.gpa, live:1}];
  let cg=null; chain.forEach(c=>{ if(c.gpa==null) return; cg = cg==null ? c.gpa : r2((cg + c.gpa)/2); c.cgpa=cg; });
  return {chain, cgpa:cg, p10:cg==null?null:r2(cg/10), missing:[4,5,6].filter(dj=>dj<effDarjah(p) && !chain.some(c=>c.darjah===dj))}; }
async function pjSaveYear(btn){ const Y=classYear(); const {rows}=pjSummary(); if(!rows.length) return; const old=btn?btn.innerHTML:''; if(btn) btn.disabled=true;
  try{ let n=0; for(const x of rows){ const id=('r'+Y+'-'+pjNameKey(x.p.nama)).slice(0,150); await dbPut('pajsk_rekod', id, {nk:pjNameKey(x.p.nama), nama:x.p.nama, kelas:x.p.kelas, darjah:effDarjah(x.p), tahun:Y, gpa:x.r.tl?null:x.r.gpa, gred:x.r.gred, sumber:'hab', updatedAt:new Date().toISOString()}); n++; if(btn) btn.textContent=`Menyimpan ${n}/${rows.length}…`; }
    await saveCfg({pjSaved:{...(cfg().pjSaved||{}), [Y]:todayStr()}}); toast(`GPA ${rows.length} murid tahun ${Y} disimpan untuk dibawa ke hadapan`); }
  catch(e){ toast(writeErr(e)); } finally{ if(btn){ btn.disabled=false; btn.innerHTML=old; } } }

let sijilFontB64=null;
async function loadSijilFont(){ if(sijilFontB64) return sijilFontB64; const r=await fetch('/_blob/'+ASSET_FONT); const b=new Uint8Array(await r.arrayBuffer()); let s=''; for(let i=0;i<b.length;i+=0x8000) s+=String.fromCharCode.apply(null, b.subarray(i,i+0x8000)); sijilFontB64=btoa(s); return sijilFontB64; }
async function sijilTplData(){ const c=cfg(); const id=(c.sijilTpl&&c.sijilTpl.id)||ASSET_SIJIL; const r=await fetch('/_blob/'+id); const b=await r.blob(); return await new Promise((res,rej)=>{ const f=new FileReader(); f.onload=()=>res(f.result); f.onerror=rej; f.readAsDataURL(b); }); }
function jkMurid(r){ return activeMembers(r.id).filter(m=>m.jawatan&&m.jawatan!=='Ahli').sort((a,b)=>jawRank(a.jawatan)-jawRank(b.jawatan)||cmpMurid(a,b)); }
// Nama unit dipapar seperti disimpan; jika semuanya huruf besar, tukar ke huruf awal besar tetapi kekalkan singkatan (TKRS, PPIM, PPKI, STEM)
function unitCase(n){ n=String(n||''); if(/[a-z]/.test(n)) return n; return n.split(/(\s+)/).map(w=>{ const core=w.replace(/[()]/g,''); return (/^\(.*\)$/.test(w) || (core.length<=4 && !/^(DAN|BAGI|KAB|BOLA)$/.test(core))) ? w : w.charAt(0)+w.slice(1).toLowerCase(); }).join(''); }
function drawSijilJK(d, m, r, o, hasFont){ const W=210, cx=W/2; const ink=[65,75,59];
  if(o.tpl) d.addImage(o.tpl, 'JPEG', 0, 0, 210, 297, 'sijiltpl', 'FAST');
  const F=()=>d.setFont(hasFont?'InterXB':'helvetica', hasFont?'normal':'bold');
  const fit=(t, size, maxW, min)=>{ F(); let fs=size; d.setFontSize(fs); while(d.getTextWidth(t)>maxW && fs>min){ fs-=0.5; d.setFontSize(fs); } return fs; };
  d.setTextColor(...ink); F(); d.setFontSize(22);
  const nm=String(m.nama).toUpperCase(); let L=d.splitTextToSize(nm, 140); if(L.length>3){ d.setFontSize(18); L=d.splitTextToSize(nm,150).slice(0,3); }
  const y0 = L.length===1 ? 139 : L.length===2 ? 133.5 : 129; L.forEach((l,i)=>{ fit(l, L.length>2?18:22, 150, 14); d.text(l, cx, y0+i*(L.length>2?10:12), {align:'center'}); });
  d.setTextColor(0); d.setFont('helvetica','normal'); d.setFontSize(17); d.text(String(m.jawatan).toUpperCase(), cx, 178.5, {align:'center', maxWidth:160});
  const un=unitCase(r.nama); d.setTextColor(...ink); F(); d.setFontSize(22); let yT=213;
  if(d.getTextWidth(un)<=156){ d.text(un, cx, 204.5, {align:'center'}); }
  else { d.setFontSize(20); const U=d.splitTextToSize(un, 150).slice(0,2); U.forEach((l,i)=>{ fit(l,20,160,14); d.text(l, cx, 199+i*9, {align:'center'}); }); yT=216.5; }
  d.setTextColor(0); d.setFont('helvetica','normal'); d.setFontSize(14.5); d.text(`Bagi tahun ${r.tahun}`, cx, yT, {align:'center'});
  d.setFontSize(14.5); if(o.gb) d.text(String(o.gb).toUpperCase(), cx, 240.3, {align:'center'}); d.text(o.gbT, cx, 248.4, {align:'center'}); }
async function sijilJKPdf(items, o, btn, fname){ const old=btn?btn.innerHTML:''; if(btn){ btn.disabled=true; btn.textContent='Menyediakan sijil…'; }
  try{ await loadPdf(); const {jsPDF}=window.jspdf; const d=new jsPDF({unit:'mm',format:'a4'}); let hasFont=false;
    try{ d.addFileToVFS('InterXB.ttf', await loadSijilFont()); d.addFont('InterXB.ttf','InterXB','normal'); hasFont=true; }catch(e){}
    const custom=cfg().sijilTpl; let vecTpl=null;

  layer.addEventListener('pointermove',e=>{ if(!drag) return; const P=sjPage(design.orient); const el=get(drag.k); el.y=Math.max(0,Math.min(P.H, Math.round((drag.y0+(e.clientY-drag.sy)/k)*2)/2)); el.x=Math.max(0,Math.min(P.W, Math.round((drag.x0+(e.clientX-drag.sx)/k)*2)/2));
    const row=elsBox.querySelector(`[data-el="${CSS.escape(drag.k)}"]`); if(row){ row.querySelector('[data-f="y"]').value=el.y; row.querySelector('[data-f="x"]').value=el.x; } drawPreview(); });
  layer.addEventListener('pointerup',()=>{ drag=null; });
}

    body: ps.length ? `<p class="sub" style="margin:0 0 10px">Isi keputusan setiap peserta, kemudian muat turun sijil atau simpan ke Pencapaian supaya dikira dalam PAJSK. Murid tanpa keputusan dianggap <b>Penyertaan</b>.</p>

      <div class="tablewrap cards"><table><thead><tr><th><input type="checkbox" id="ak_all" checked aria-label="Pilih semua"></th><th>Nama</th><th>Kelas</th><th>Keputusan</th><th>Kategori (pilihan)</th></tr></thead><tbody>
      ${ps.map((p,i)=>{ const o=kpOf(p); return `<tr><td><input type="checkbox" data-akon="${i}" checked></td><td class="title-cell" data-label="Nama">${esc(p.nama)}</td><td data-label="Kelas">${esc(p.kelas||'')}</td><td data-label="Keputusan"><select data-akk="${i}"${ed?'':' disabled'}>${AK_KEP.map(k=>`<option ${k===(o.k||'Penyertaan')?'selected':''}>${k}</option>`).join('')}</select></td><td data-label="Kategori"><input data-akc="${i}" value="${esc(o.kat||'')}" placeholder="cth. Tahun 4"${ed?'':' disabled'} style="min-width:110px"></td></tr>`; }).join('')}</tbody></table></div>
      ${linked.length?`<p class="hint" style="margin:8px 0 0">Sudah disimpan ke Pencapaian (${linked.length} rekod). Simpan semula akan menggantikan rekod tersebut.</p>`:''}`
      : `<p class="note" style="margin:0">Aktiviti ini belum ada senarai peserta. Tekan “Edit” pada aktiviti dan tambah murid di bahagian peserta dahulu.</p>`,
    foot:`<span class="sp"></span><button type="button" class="btn btn-ghost" data-close>Tutup</button>${ps.length&&ed?`<button type="button" class="btn btn-ghost" data-aksave>Simpan keputusan</button><button type="button" class="btn btn-ghost" data-akcap>${svg('pencapaian')}Simpan ke Pencapaian</button>`:''}${ps.length&&state.dl?`<button type="button" class="btn btn-main" data-aksj>${svg('down')}Muat turun sijil</button>`:''}`});

        let n=0; for(const g of [...G.values()].sort((a,b)=>ord(a.k)-ord(b.k))){ await state.db.collection('records').add({sec:'pencapaian', tahun:Y, tarikh:rec.tarikh, peringkat:lvlToCapai(rec.peringkat)||'Sekolah', bidang:bd, unitId:'', unitNama:'', jenis:'Pertandingan', keputusan:g.k, pertandingan:nm+(g.kat?` (${g.kat})`:''), murid:'', guruList:rec.guruList||[], guru:rec.guru||'', catatan:'Dijana daripada Aktiviti & Takwim', peserta:g.peserta, lampiran:[], sumberAktiviti:rec.id, createdAt:now, updatedAt:now}); n++; }

    const sj=e.target.closest('[data-aksj]'); if(sj){ const kpv=read(); const nm=form.querySelector('#ak_n').value.trim()||rec.nama; const gb=gbNama(Y);
      const sel=ps.map((p,i)=>({p,i})).filter(({i})=>form.querySelector(`[data-akon="${i}"]`).checked).sort((a,b)=>ord(kpv[pkey(a.p)].k)-ord(kpv[pkey(b.p)].k));
      if(!sel.length){ toast('Pilih sekurang-kurangnya seorang murid.'); return; }

}

  const n=Math.max(0, past.length - reps.filter(p=>!p.tarikh||p.tarikh<=today).length); if(!n) return [];
  const unmatched=past.filter(t=>!reps.some(p=>p.tarikh===t.tarikh)); return unmatched.slice(-n); }

function nextTakwim(u){ const today=todayStr(); return (u.takwim||[]).filter(t=>t.tarikh&&t.tarikh>=today).sort((a,b)=>a.tarikh.localeCompare(b.tarikh))[0]; }

/* ===== Versi laman sendiri (Netlify + Firebase) ===== */
const IS_SA = !!window.KOKO_STANDALONE;
// Sandaran penuh: semua koleksi + semua fail dalam satu ZIP (untuk pemindahan ke laman sendiri)
const SANDARAN_COLS=['config','records','members','reports','olahraga','olahraga_acara','olahraga_daftar','pajsk','pajsk_rekod','log'];
async function loadJSZip(){ if(window.JSZip) return; await scriptOnce(['https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js','https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js']); }
function collectBlobIds(o, out){ if(!o||typeof o!=='object') return out; if(Array.isArray(o)){ o.forEach(x=>collectBlobIds(x,out)); return out; } if(typeof o.id==='string'&&/^[0-9a-f]{32}$/.test(o.id)) out.add(o.id); Object.values(o).forEach(v=>collectBlobIds(v,out)); return out; }
async function sandaranPenuh(btn){ if(!state.isAdmin){ toast('Untuk pentadbir sahaja.'); return; } const old=btn.innerHTML; btn.disabled=true; const say=t=>btn.textContent=t;
  try{ await loadJSZip(); const zip=new window.JSZip(); const data={versi:1, dibuat:new Date().toISOString(), sekolah:cfg().sekolah||'', koleksi:{}}; const db=state.rawDb;
    for(const c of SANDARAN_COLS){ say(`Membaca ${c}…`); const m=new Map(); const add=sn=>sn.docs.forEach(d=>m.set(d.id,{id:d.id, data:d.data()}));
      add(await db.collection(c).limit(1000).get());
      if(m.size>=1000){ const yNow=new Date().getFullYear(); for(let y=2018;y<=yNow+2;y++){ say(`Membaca ${c} ${y}…`); try{ add(await db.collection(c).where('tahun','==',y).limit(1000).get()); }catch(e){} try{ add(await db.collection(c).where('tahun','==',String(y)).limit(1000).get()); }catch(e){} } }
      data.koleksi[c]=[...m.values()]; }
    const ids=collectBlobIds(data.koleksi, new Set()); const meta={}; let n=0, gagal=0;
    for(const id of ids){ say(`Fail ${++n}/${ids.size}…`); try{ const r=await fetch('/_blob/'+id); if(!r.ok) throw 0; const b=await r.blob(); zip.file('fail/'+id, b); meta[id]=b.type||'application/octet-stream'; }catch(e){ gagal++; } }
    data.fail=meta; zip.file('data.json', JSON.stringify(data));
    say('Memampatkan…'); const blob=await zip.generateAsync({type:'blob', compression:'DEFLATE'});
    await saveFile(`Sandaran-Penuh-${slug(cfg().sekolah||'hab')}-${todayStr()}.zip`, blob);
    toast(`Sandaran penuh: ${Object.values(data.koleksi).reduce((a,x)=>a+x.length,0)} dokumen, ${Object.keys(meta).length} fail${gagal?`, ${gagal} fail gagal`:''}`); }
  catch(e){ console.error(e); toast('Sandaran tidak dapat disediakan'+(e&&(e.code||e.message)?` (${e.code||e.message})`:'')+'. Cuba lagi.'); } finally{ btn.disabled=false; btn.innerHTML=old; } }
async function pulihPenuh(file, out){ if(!IS_SA||!state.isAdmin) return; const say=t=>{ if(out) out.textContent=t; };
  try{ await loadJSZip(); const zip=await window.JSZip.loadAsync(file); const data=JSON.parse(await zip.file('data.json').async('string')); const fs=window.KOKO_FS;
    const files=Object.entries(data.fail||{}); let i=0; for(const [id,type] of files){ say(`Memuat naik fail ${++i}/${files.length}…`); const f=zip.file('fail/'+id); if(f){ const b=await f.async('blob'); await window.KOKO_BLOB_PUT(id, b, type); } }
    let n=0; const all=Object.entries(data.koleksi).flatMap(([c,docs])=>docs.map(d=>({c,d}))); for(let j=0;j<all.length;j+=400){ const bt=fs.batch(); all.slice(j,j+400).forEach(({c,d})=>{ if(c==='config'&&d.id!=='app') return; bt.set(fs.collection(c).doc(d.id), d.data); }); await bt.commit(); n=Math.min(all.length,j+400); say(`Menulis data ${n}/${all.length}…`); }
    say(`Selesai: ${all.length} dokumen dan ${files.length} fail dipulihkan. Muat semula halaman.`); toast(`Pemulihan selesai: ${all.length} dokumen, ${files.length} fail`); }
  catch(e){ console.error(e); say('Pemulihan gagal: '+(e&&e.message||e)); } }

    el.innerHTML = all.length ? `<div class="tablewrap cards"><table><thead><tr><th>Masa</th><th>Pengguna</th><th>Tindakan</th><th>Bahagian</th><th>Butiran</th></tr></thead><tbody>${all.slice(0,300).map(e=>{ const d=new Date(e.t); return `<tr><td data-label="Masa">${esc(d.toLocaleDateString('ms-MY',{day:'numeric',month:'short'}))} ${esc(d.toLocaleTimeString('ms-MY',{hour:'2-digit',minute:'2-digit'}))}</td><td data-label="Pengguna">${esc(who(e.u))}</td><td data-label="Tindakan"><span class="pill ${e.a==='delete'?'pill-warn':'pill-hue'}">${esc(LOG_ACT[e.a]||e.a)}</span></td><td data-label="Bahagian">${esc(LOG_COL[e.c]||e.c)}</td><td data-label="Butiran">${esc(e.s)}</td></tr>`; }).join('')}</tbody></table></div><p class="hint" style="margin:10px 0 0">Menunjukkan perubahan 14 hari terakhir yang mempunyai aktiviti. Operasi pukal digabungkan dalam satu baris.</p>` : '<div class="empty"><p>Belum ada perubahan direkodkan. Sejarah bermula daripada versi hab ini.</p></div>';
  }catch(e){ el.innerHTML='<p class="sub">Sejarah tidak dapat dimuatkan.</p>'; }
}
/* ---------- paparan TV papan mata ---------- */
function renderTv(){
  const c=olCfg(); const Y=olYear();
  if(!state.ol) return `<section class="tv"><div class="tvhead"><h1>Kejohanan olahraga ${Y} belum disediakan</h1><a class="btn btn-ghost" href="#olahraga">Kembali</a></div></section>`;
  const T=olTally(); const mx=Math.max(1,...T.list.map(x=>x.pts));
  const done=olAcara().filter(a=>(a.keputusan||[]).length).sort((a,b)=>String(b.updatedAt||'').localeCompare(String(a.updatedAt||''))).slice(0,6);
  const res=a=>{ const ks=(a.keputusan||[]).slice().sort((x,y)=>(x.tempat||0)-(y.tempat||0)); if(a.format==='kelayakan') return ks.map(k=>`${rDot(rumahById(k.rumahId))} <b>${+k.lulus||0}</b>`).join(' '); return ks.slice(0,3).map(k=>`<span class="tvp">${k.tempat}. ${k.rumahId?rDot(rumahById(k.rumahId)):''} ${esc(((k.peserta||[])[0]||{}).nama||k.asal||'')}</span>`).join(''); };
  return `<section class="tv">
    <div class="tvhead"><div><div class="eyebrow">${esc(cfg().sekolah)}</div><h1>${esc(c.nama)}</h1><p>${T.done}/${T.total} acara selesai · dikemas kini secara langsung</p></div><a class="btn btn-ghost" href="#olahraga">Keluar</a></div>
    <div class="tvboard">${T.list.map((x,i)=>`<div class="tvteam${i===0?' lead':''}" style="--rh:${rumahHue(x.r)}"><span class="pos">${i+1}</span><span class="nm">${esc(x.r.nama.replace(/^Rumah\s+/i,''))}</span><div class="tr"><div class="fl" style="width:${x.pts/mx*100}%"></div></div><span class="pt">${x.pts}</span><span class="md">🥇${x.e} 🥈${x.p} 🥉${x.g}</span></div>`).join('')}</div>
    <h2 class="tvsub">Keputusan terkini</h2>
    <div class="tvres">${done.map(a=>{ const k=olKat(a.kategoriId); return `<div class="tvr"><div class="sub">No. ${esc(a.no)} · ${esc(k?k.nama:'')}</div><b>${esc(a.nama)}</b><div class="tvps">${res(a)}</div></div>`; }).join('')||'<p class="sub">Belum ada keputusan.</p>'}</div>
  </section>`;
}
/* ---------- sijil PDF ---------- */
function sijilSigners(){ const Y=classYear(); const jk=state.records.filter(r=>r.sec==='jawatankuasa'&&+r.tahun===Y); const f=re=>((jk.find(r=>re.test(r.jawatan||''))||{}).nama)||''; return {gb:f(/Guru Besar/i), su:f(/^Setiausaha Kokurikulum/i)}; }
async function sijilPdf(list, filename, btn){
  if(!list.length){ toast('Tiada peserta untuk sijil.'); return; }
  const old=btn?btn.innerHTML:''; if(btn){ btn.disabled=true; btn.textContent='Menyediakan sijil…'; }
  try{ await loadPdf(); const {jsPDF}=window.jspdf; const d=new jsPDF({unit:'mm',format:'a4',orientation:'l'}); const W=297,H=210; const sg=sijilSigners(); const C=cfg();
    const cols=[[31,154,85],[42,132,230],[124,77,255],[235,106,48],[214,69,128]];
    list.forEach((x,i)=>{ if(i) d.addPage('a4','l');
      cols.forEach((c,j)=>{ d.setFillColor(...c); d.rect(j*(W/cols.length),0,W/cols.length+0.5,6,'F'); d.rect(j*(W/cols.length),H-6,W/cols.length+0.5,6,'F'); });
      d.setDrawColor(200,200,215); d.setLineWidth(0.6); d.rect(12,14,W-24,H-28); addLogo(d, W/2-6.5, 16, 13);
      d.setTextColor(90,90,110); d.setFont('helvetica','bold'); d.setFontSize(12); d.text(String(C.sekolah||'').toUpperCase(), W/2, 32, {align:'center'});
      d.setFont('helvetica','normal'); d.setFontSize(10); d.text(String(C.lokasi||''), W/2, 38, {align:'center'});
      d.setTextColor(30,30,50); d.setFont('helvetica','bold'); d.setFontSize(30); d.text(x.jenis==='pencapaian'?'SIJIL PENCAPAIAN':'SIJIL PENYERTAAN', W/2, 60, {align:'center'});
      d.setFont('helvetica','normal'); d.setFontSize(12); d.setTextColor(90,90,110); d.text('Dengan ini disahkan bahawa', W/2, 76, {align:'center'});
      d.setFont('helvetica','bold'); d.setFontSize(22); d.setTextColor(30,30,50); const nm=d.splitTextToSize(String(x.nama||'').toUpperCase(), W-60); d.text(nm, W/2, 92, {align:'center'}); let y=92+9*(nm.length-1);
      d.setFont('helvetica','normal'); d.setFontSize(12); d.setTextColor(90,90,110); if(x.kelas){ y+=8; d.text(x.kelas, W/2, y, {align:'center'}); }
      y+=12; d.text(x.jenis==='pencapaian'?'telah memperoleh':'telah menyertai', W/2, y, {align:'center'});
      if(x.keputusan){ y+=11; d.setFont('helvetica','bold'); d.setFontSize(18); d.setTextColor(31,154,85); d.text(String(x.keputusan).toUpperCase(), W/2, y, {align:'center'}); }
      y+=10; d.setFont('helvetica','bold'); d.setFontSize(14); d.setTextColor(30,30,50); const ev=d.splitTextToSize(x.acara||'', W-70); d.text(ev, W/2, y, {align:'center'}); y+=6*ev.length;
      d.setFont('helvetica','normal'); d.setFontSize(11); d.setTextColor(90,90,110); if(x.butiran){ d.text(x.butiran, W/2, y+2, {align:'center'}); }
      const sy=H-40; d.setDrawColor(120,120,140); d.line(40,sy,110,sy); d.line(W-110,sy,W-40,sy); d.setFontSize(10);
      d.text(sg.gb||'', 75, sy+6, {align:'center'}); d.text('Guru Besar', 75, sy+11, {align:'center'}); d.text(sg.su||'', W-75, sy+6, {align:'center'}); d.text('Setiausaha Kokurikulum', W-75, sy+11, {align:'center'});
    });
    await saveFile(filename.replace(/[^A-Za-z0-9.\-]+/g,'-').replace(/-+/g,'-'), d.output('blob')); toast(`${list.length} sijil disediakan`);
  }catch(e){ console.error(e); toast('Sijil tidak dapat disediakan. Semak sambungan internet.'); }
  finally{ if(btn){ btn.disabled=false; btn.innerHTML=old; } }
}
function sijilFromRecord(r, btn){
  const ps=(r.peserta||[]).slice().sort(cmpMurid); const capai=r.sec==='pencapaian';
  const kep = capai && r.keputusan && !/penyertaan|lain/i.test(r.keputusan) ? r.keputusan : '';
  sijilPdf(ps.map(p=>({nama:p.nama, kelas:p.kelas, jenis:kep?'pencapaian':'penyertaan', keputusan:kep, acara:r.pertandingan||r.nama, butiran:[r.peringkat?('Peringkat '+String(r.peringkat).replace(/\s*\(.*\)/,'')):'', r.tarikh?fmtDate(r.tarikh):'', r.tempat||''].filter(Boolean).join(' · ')})), `Sijil-${r.pertandingan||r.nama}.pdf`, btn);
}
const OL_TEMPAT=['Tempat Pertama','Tempat Kedua','Tempat Ketiga','Tempat Keempat','Tempat Kelima'];
function olPoolOpts(a, reg, pool, regSet, all){ const luar=(a.terbuka?(a.pesertaLuar||[]):[]).map(p=>`<option value="${esc(p.nama)}" label="${esc(p.asal||'')} · berdaftar"></option>`).join('');
  const list = (reg.length||luar) && !all ? reg : reg.concat(pool.filter(p=>!regSet.has(p.key)));
  return luar + list.map(p=>`<option value="${esc(p.nama)} (${esc(p.kelas)})" label="${esc(p.rumah||'')}${regSet.has(p.key)?' · berdaftar':''}"></option>`).join(''); }
function olSijilEntries(acaras, maxT){ const c=olCfg(); const gb=gbNama(olYear()); const out=[];
  acaras.forEach(a=>{ const k=olKat(a.kategoriId); (a.keputusan||[]).filter(x=>x.tempat>=1&&x.tempat<=maxT).sort((x,y)=>x.tempat-y.tempat).forEach(x=>{ const r=rumahById(x.rumahId); (x.peserta||[]).filter(p=>p.nama).forEach(p=>out.push({nama:p.nama, kelas:p.kelas||x.asal||'', keputusan:OL_TEMPAT[x.tempat-1]||('Tempat '+x.tempat), acara:a.nama, kategori:k?k.nama:'', rumah:r?r.nama:(x.asal||''), kejohanan:c.nama||'Kejohanan Olahraga', tarikh:a.tarikh||c.tarikh||'', tahun:olYear(), gb})); }); });
  return out; }
function sijilFromAcara(a, btn){ const L=olSijilEntries([a], 3); if(!L.length){ toast('Belum ada pemenang tempat 1–3.'); return; } sijilDownload('olahraga', L, btn, `Sijil-${a.no}-${slug(a.nama)}.pdf`); }
function olSijilSemua(btn){ const maxT=+(($('olsjmax')||{}).value)||3; const L=olSijilEntries(olAcara().slice().sort((x,y)=>(+x.no||0)-(+y.no||0)), maxT); if(!L.length){ toast('Belum ada keputusan acara.'); return; } sijilDownload('olahraga', L, btn, `Sijil-Pemenang-Olahraga-${olYear()}.pdf`); }
function olSijilBest(btn){ const c=olCfg(); const ind=olIndividu(); const gb=gbNama(olYear()); const best=ids=>ind.find(x=>ids.includes(x.kategoriId)); const anug=c.kategori.filter(k=>k.anugerah); const L=[];
  const push=(lbl,x,kat)=>{ if(x) L.push({nama:x.nama, kelas:x.kelas, keputusan:lbl, acara:kat, kategori:kat, rumah:(rumahById(x.rumahId)||{}).nama||'', kejohanan:c.nama||'Kejohanan Olahraga', tarikh:c.tarikh||'', tahun:olYear(), gb}); };
  if(anug.length) anug.forEach(k=>push(k.jantina==='P'?'Olahragawati':'Olahragawan', best([k.id]), k.nama));
  else { push('Olahragawan', best(c.kategori.filter(k=>!k.sukantara&&k.jantina==='L').map(k=>k.id)), 'Keseluruhan'); push('Olahragawati', best(c.kategori.filter(k=>!k.sukantara&&k.jantina==='P').map(k=>k.id)), 'Keseluruhan'); }
  if(!L.length){ toast('Belum ada olahragawan/olahragawati.'); return; } sijilDownload('olahraga', L, btn, `Sijil-Olahragawan-${olYear()}.pdf`); }
if(IS_SA){ const b=$('sa_out'); if(b){ b.hidden=false; b.addEventListener('click',()=>{ if(confirm('Log keluar daripada hab?')) window.KOKO_LOGOUT(); }); if(window.KOKO_ME) b.title='Log keluar ('+(window.KOKO_ME.emel||'')+')'; } }
route();
(async ()=>{
  const C = window.claude;
  if(!C || !C.use){ state.offline=true; state.loaded=state.mloaded=state.rloaded=true; render(); return; }
  const [db, user, dl, assets] = await Promise.all([C.use('db'), C.use('user'), C.use('downloads'), C.use('assets')]);
  state._dl = dl; Object.defineProperty(state,'dl',{configurable:true, get(){ return this._dl && (typeof canArea!=='function' || canArea('cetak')) ? this._dl : null; }, set(v){ this._dl=v; }}); state.assets = assets;
  if(!db){ state.offline=true; state.loaded=state.mloaded=state.rloaded=true; render(); return; }
  initAI().catch(()=>{}); state.rawDb = db; state.db = wrapDb(db); state.user = user;
  if(user){ try{ state.uid = await user.id(); }catch(e){} try{ state.canWrite = await user.can('data.write'); }catch(e){} try{ state.isAdmin = await user.canEdit(); }catch(e){} setTimeout(notePresence, 4000); }
  db.doc('config/app').onSnapshot(snap=>{ state.cfg = snap.exists ? snap.data() : {}; render(); }, ()=>{});
  db.collection('records').limit(1000).onSnapshot(snap=>{
    state.records = snap.docs.map(d=>({id:d.id, ...d.data()}));
    state.loaded = true; render();
  }, ()=>{ state.loaded=true; state.offline=true; render(); });
  db.collection('members').limit(1000).onSnapshot(snap=>{
    const m={}; snap.docs.forEach(d=>{ m[d.id]=d.data(); }); state.members=m; state.mloaded=true; render();
  }, ()=>{ state.mloaded=true; render(); });
  subscribeReports();
  subscribeOlahraga();
  subscribePajsk(); subscribePjRek();
})();
